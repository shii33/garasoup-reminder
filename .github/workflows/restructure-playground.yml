name: Restructure playground data

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restructure:
    if: github.event.head_commit.message == 'Prepare playground data restructure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build maintainable layout
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64, hashlib, json, shutil, tarfile

          root=Path('.')
          old_data=root/'assets'/'data'
          if not old_data.exists():
              raise RuntimeError('変換元 assets/data が見つかりません')

          # Prepare new encrypted data without decrypting or changing the passphrase.
          new_data=root/'data'
          updates=new_data/'memories-updates'
          updates.mkdir(parents=True,exist_ok=True)
          parts=sorted(old_data.glob('corex-*.part'))
          if len(parts)!=10:
              raise RuntimeError(f'corex が10分割揃っていません: {len(parts)}')
          core=''.join(p.read_text(encoding='utf-8') for p in parts)
          json.loads(core)
          (new_data/'core.enc').write_text(core,encoding='utf-8')

          base=old_data/'memories.enc'
          extra=old_data/'memories-extra.enc'
          if not base.exists() or not extra.exists():
              raise RuntimeError('思い出のbase/update変換元が揃っていません')
          json.loads(base.read_text(encoding='utf-8'))
          json.loads(extra.read_text(encoding='utf-8'))
          shutil.copy2(base,new_data/'memories-base.enc')
          update_name='20260924-001.enc'
          shutil.copy2(extra,updates/update_name)
          manifest={'version':2,'base':'memories-base.enc','updates':[{'file':f'memories-updates/{update_name}','count':8}],'compact_after':20}
          (new_data/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Replace the transport-packed site with the already prepared clean static site.
          bundle=root/'_migration'/'static.tgz.b64'
          if not bundle.exists():
              raise RuntimeError('clean static bundle が見つかりません')
          archive=Path('/tmp/warera-static.tgz')
          archive.write_bytes(base64.b64decode(bundle.read_text(encoding='ascii')))
          temp=Path('/tmp/warera-static')
          shutil.rmtree(temp,ignore_errors=True); temp.mkdir()
          with tarfile.open(archive,'r:gz') as tf:
              for m in tf.getmembers():
                  target=(temp/m.name).resolve()
                  if temp.resolve() not in target.parents and target!=temp.resolve():
                      raise RuntimeError('不正なarchive path')
              tf.extractall(temp)

          shutil.rmtree(root/'assets')
          for src in temp.iterdir():
              dst=root/src.name
              if src.is_dir():
                  if dst.exists(): shutil.copytree(src,dst,dirs_exist_ok=True)
                  else: shutil.copytree(src,dst)
              else:
                  shutil.copy2(src,dst)

          # Rewrite the updater for one core file + incremental memory packs.
          up_path=root/'scripts'/'update_log.py'
          up=up_path.read_text(encoding='utf-8')
          up=up.replace(r"(\d{2}:\d{2}:\d{2})",r"(\d{1,2}:\d{2}:\d{2})",1)
          a=up.index('def load_core('); b=up.index('def is_call(',a)
          core_funcs="""def load_core(data_dir,password):\n    return decrypt_obj(load_json(data_dir/'core.enc'),password)\n\ndef save_core(data_dir,core,password):\n    save_json(data_dir/'core.enc',encrypt_obj(core,password))\n\n"""
          up=up[:a]+core_funcs+up[b:]
          main=up.index('def main():')
          new_main=r'''def main():
              ap=argparse.ArgumentParser(description='我らのあそび場：ログ差分更新')
              ap.add_argument('input',nargs='?',help='_chat.txt。省略すると標準入力（ベタ貼り）')
              ap.add_argument('--root',default=str(Path(__file__).resolve().parents[1]))
              ap.add_argument('--password',default=os.getenv('WARERA_PASSPHRASE'))
              ap.add_argument('--dry-run',action='store_true')
              args=ap.parse_args(); root=Path(args.root); data=root/'data'; state_path=root/'scripts'/'state.json'
              password=args.password or getpass.getpass('合言葉: ')
              raw=Path(args.input).read_text(encoding='utf-8-sig') if args.input else sys.stdin.read()
              records=parse_records(raw)
              if not records: sys.exit('ログ形式を読み取れませんでした')
              state=json.loads(state_path.read_text(encoding='utf-8'))
              cutoff=datetime.fromisoformat(state['last_processed'])
              processed=set(state.get('processed_record_ids',[]))
              def rid(r):
                  s=f"{r['dt'].isoformat()}\0{r['sender']}\0{r['text']}"
                  return hashlib.sha256(s.encode()).hexdigest()[:24]
              new=[r for r in records if r['dt']>cutoff and rid(r) not in processed]
              if not new: print('新しいログはありません。変更なし。'); return
              print(f'新規 {len(new)} レコード: {new[0]["dt"]} → {new[-1]["dt"]}')
              if args.dry_run: return

              core=load_core(data,password)
              core['stats']=update_stats(core['stats'],new,state)
              core['dictionary']=update_dictionary(core['dictionary'],new)
              core['quiz']=update_quiz(core['quiz'],new)
              save_core(data,core,password)

              manifest=load_json(data/'manifest.json')
              memories=[]
              for rel in [manifest['base']]+[x['file'] for x in manifest.get('updates',[])]:
                  payload=decrypt_obj(load_json(data/rel),password)
                  memories.extend(payload['memories'] if isinstance(payload,dict) else payload)
              next_id=max((x.get('id',0) for x in memories),default=0)+1
              additions=[]
              for day,groups in sorted(scenes_by_day(new,10).items()):
                  for lines in groups:
                      additions.append({'id':next_id,'date':day,'lines':lines}); next_id+=1
              if additions:
                  stamp=max(r['dt'] for r in new).strftime('%Y%m%d'); n=1
                  while True:
                      rel=f'memories-updates/{stamp}-{n:03d}.enc'
                      if not (data/rel).exists(): break
                      n+=1
                  (data/rel).parent.mkdir(parents=True,exist_ok=True)
                  save_json(data/rel,encrypt_obj({'version':1,'count':len(additions),'memories':additions},password))
                  manifest.setdefault('updates',[]).append({'file':rel,'count':len(additions)})
                  save_json(data/'manifest.json',manifest)

              state['last_processed']=max(r['dt'] for r in new).isoformat()
              processed.update(rid(r) for r in new)
              state['processed_record_ids']=list(processed)[-5000:]
              state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print(f'更新完了: {state["last_processed"]}')
              print(f'core: 1 file / memories added: {len(additions)}件')

          if __name__=='__main__': main()
          '''
          # The raw block is indented only to keep this workflow readable.
          lines=new_main.splitlines(); nonempty=[len(x)-len(x.lstrip()) for x in lines if x.strip()]
          cut=min(nonempty) if nonempty else 0
          new_main='\n'.join(x[cut:] if len(x)>=cut else x for x in lines).lstrip()
          up_path.write_text(up[:main]+new_main+'\n',encoding='utf-8')

          compact=r'''#!/usr/bin/env python3
          import argparse, getpass, os
          from pathlib import Path
          from update_log import decrypt_obj, encrypt_obj, load_json, save_json

          def main():
              ap=argparse.ArgumentParser(description='思い出の差分をbaseへ統合')
              ap.add_argument('--root',default=str(Path(__file__).resolve().parents[1]))
              ap.add_argument('--password',default=os.getenv('WARERA_PASSPHRASE'))
              args=ap.parse_args(); root=Path(args.root); data=root/'data'
              password=args.password or getpass.getpass('合言葉: ')
              manifest=load_json(data/'manifest.json'); updates=manifest.get('updates',[])
              if not updates: print('まとめる差分はありません。'); return
              payload=decrypt_obj(load_json(data/manifest['base']),password)
              base=payload['memories'] if isinstance(payload,dict) else payload
              by_id={x.get('id'):x for x in base}; added=0
              for item in updates:
                  payload=decrypt_obj(load_json(data/item['file']),password)
                  rows=payload['memories'] if isinstance(payload,dict) else payload
                  for row in rows:
                      key=row.get('id')
                      if key not in by_id: by_id[key]=row; added+=1
              merged=sorted(by_id.values(),key=lambda x:(x.get('date',''),x.get('id',0)))
              save_json(data/manifest['base'],encrypt_obj({'version':1,'count':len(merged),'memories':merged},password))
              for item in updates:
                  p=data/item['file']
                  if p.exists(): p.unlink()
              manifest['updates']=[]; save_json(data/'manifest.json',manifest)
              print(f'統合完了: +{added}件 / 合計{len(merged)}件')

          if __name__=='__main__': main()
          '''
          lines=compact.splitlines(); nonempty=[len(x)-len(x.lstrip()) for x in lines if x.strip()]
          cut=min(nonempty) if nonempty else 0
          compact='\n'.join(x[cut:] if len(x)>=cut else x for x in lines).lstrip()
          (root/'scripts'/'compact_memories.py').write_text(compact+'\n',encoding='utf-8')
          (root/'scripts'/'README.md').write_text(
              '# ログ更新\n\n`python scripts/update_log.py _chat.txt` で全ログ、標準入力でベタ貼り差分を更新できます。\n\n思い出の差分をまとめるときは `python scripts/compact_memories.py`。\n\nデータは `data/core.enc`、`data/memories-base.enc`、`data/memories-updates/`、`data/manifest.json` に集約しています。\n',encoding='utf-8')

          shutil.rmtree(root/'_migration')
          PY

      - name: Validate layout
        shell: bash
        run: |
          test -s index.html
          test -s assets/auth.js
          test -s data/auth.enc
          test -s data/core.enc
          test -s data/memories-base.enc
          test -s data/memories-updates/20260924-001.enc
          test -s data/manifest.json
          test -s on-this-day/index.html
          test ! -e assets/site
          test ! -e assets/data
          python3 -m py_compile scripts/update_log.py scripts/compact_memories.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('data/core.enc').read_text())
          m=json.loads(Path('data/manifest.json').read_text())
          assert m['base']=='memories-base.enc'
          assert len(m['updates'])==1
          assert 'corex-' not in Path('index.html').read_text()
          assert 'sitez-' not in Path('index.html').read_text()
          print('validation ok')
          PY

      - name: Commit clean layout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify playground data layout"
          git push
