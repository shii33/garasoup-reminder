name: Restructure playground data

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restructure:
    if: github.event.head_commit.message == 'Prepare playground data restructure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use verified migration bundle
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('scripts/migrate_layout.py')
          s=p.read_text(encoding='utf-8')
          old="""bundle=root/'_migration'/'static.tgz.b64'
          if not bundle.exists():
              raise RuntimeError('clean static bundle が見つかりません')
          archive=Path('/tmp/warera-static.tgz')
          archive.write_bytes(base64.b64decode(bundle.read_text(encoding='ascii')))
          """
          new="""bundle_dir=root/'_migration'
          bundle_parts=sorted(bundle_dir.glob('static-*.part'))
          if len(bundle_parts)!=6:
              raise RuntimeError(f'clean static bundle parts が揃っていません: {len(bundle_parts)}')
          bundle_text=''.join(part.read_text(encoding='ascii') for part in bundle_parts)
          archive=Path('/tmp/warera-static.tgz')
          archive.write_bytes(base64.b64decode(bundle_text))
          """
          if old not in s:
              raise RuntimeError('migration bundle reader を特定できませんでした')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Build and validate clean layout
        run: python3 scripts/migrate_layout.py
      - name: Commit clean layout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify playground data layout"
          git push
