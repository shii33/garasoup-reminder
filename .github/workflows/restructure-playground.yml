name: Restructure playground data

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restructure:
    if: github.event.head_commit.message == 'Prepare playground data restructure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate clean layout
        run: python3 scripts/migrate_layout.py
      - name: Commit clean layout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify playground data layout"
          git push
