name: Apply quiz scene sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage quiz sync bundle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore staged bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/quiz-sync
          cat _sync/bundle.part-* | base64 -d > /tmp/quiz-sync/bundle.tgz
          tar -xzf /tmp/quiz-sync/bundle.tgz -C /tmp/quiz-sync
          cp /tmp/quiz-sync/quiz-scenes.enc data/quiz-scenes.enc
          cp /tmp/quiz-sync/data.js assets/data.js
          cp /tmp/quiz-sync/quiz.html quiz/index.html
          cp /tmp/quiz-sync/on-this-day.html on-this-day/index.html
          cp /tmp/quiz-sync/update_log.py scripts/update_log.py
      - name: Validate final files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, py_compile
          obj=json.loads(pathlib.Path('data/quiz-scenes.enc').read_text(encoding='utf-8'))
          assert obj.get('cipher')=='AES-256-GCM'
          assert obj.get('ciphertext')
          py_compile.compile('scripts/update_log.py', doraise=True)
          q=pathlib.Path('quiz/index.html').read_text(encoding='utf-8')
          d=pathlib.Path('assets/data.js').read_text(encoding='utf-8')
          day=pathlib.Path('on-this-day/index.html').read_text(encoding='utf-8')
          assert 'WareraData.quizScenePack' in q
          assert 'quiz-scenes.enc' in d
          assert 'source=quiz' in q
          assert "source==='quiz'" in day or 'source === \'quiz\'' in day
          PY
      - name: Commit final layout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _sync
          rm -f .github/workflows/apply-quiz-scene-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Link quiz questions to context scenes"
          git push
