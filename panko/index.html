<!DOCTYPE html><html lang="ja" class="notranslate" translate="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><meta name="robots" content="noindex,nofollow,noarchive"><title>パン粉なわれわれ｜我らのあそび場</title><link rel="stylesheet" href="../assets/site.css"><style>
.panko-shell{display:grid;grid-template-rows:auto auto auto;gap:10px}.panko-note{margin:-3px 0 4px;color:#777;font-size:10px}.chat-panel{height:420px;max-height:52vh;overflow:auto;padding:14px;border:1px solid #111;border-radius:10px;background:#fff;box-shadow:4px 4px 0 rgba(0,0,0,.42);scroll-behavior:smooth}.chat-list{display:grid;gap:8px}.chat-line.panko-typing .bubble{color:#777}.composer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.composer textarea{width:100%;min-height:44px;max-height:120px;resize:none;border:1px solid #111;border-radius:10px;padding:10px 11px;background:#fff;box-shadow:2px 2px 0 rgba(0,0,0,.35);font:inherit;font-size:16px;line-height:1.45;box-sizing:border-box}.composer .press-btn{min-width:70px}.panko-head{display:flex;align-items:center;gap:8px;margin:0 0 8px}.panko-head img{width:32px;height:32px;border-radius:50%;object-fit:cover;transform:scale(1.02)}.panko-head b{font-size:13px}.panko-head small{display:block;margin-top:2px;color:#888;font-size:9px;font-weight:400}.tiny-actions{display:flex;justify-content:flex-end;margin-top:3px}.reset-btn{border:0;background:none;padding:2px 0;color:#888;font:inherit;font-size:9px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
@media(max-width:580px){.panko-shell{display:flex;flex-direction:column;gap:8px;min-height:calc(100dvh - 232px)}.chat-panel{height:clamp(260px,34vh,360px);max-height:none;padding:11px;box-shadow:3px 3px 0 rgba(0,0,0,.42)}.panko-shell>div:last-child{margin-top:auto}.composer{gap:7px}.composer textarea{min-height:42px;padding:9px 10px}.composer .press-btn{min-width:58px}.panko-note{font-size:9px;margin-bottom:1px}}
</style></head><body><header class="site-header"><div class="site-header__inner"><a class="brand" href="../">我らのあそび場</a><button class="lock-btn" data-lock>鍵をかける</button></div></header><main class="shell app-shell conversation-shell"><div class="backline"><a href="../">← あそび場にもどる</a></div><section class="app-title"><div class="icon">🍞</div><div><h1>パン粉なわれわれ</h1></div></section><p class="panko-note">本人が戻ってくるまで、パン粉でつないどきます。</p><section class="panko-shell"><div class="panko-head"><img id="partnerAvatar" alt=""><div><b id="partnerName">---</b><small>本人ではありません。過去ログを混ぜたパン粉です。</small></div></div><div class="chat-panel" id="chatPanel"><div class="chat-list" id="chatList"></div></div><div><div class="composer"><textarea id="input" rows="1" placeholder="話しかける"></textarea><button class="press-btn primary" id="send">送る</button></div><div class="tiny-actions"><button class="reset-btn" id="reset">会話をリセット</button></div></div></section></main><script src="../assets/auth.js"></script><script src="../assets/common.js"></script><script src="../assets/data.js"></script><script>
(async()=>{
  wireLock('../');
  const KEY='warera_chat_perspective',HISTORY_KEY='warera_panko_history_v1',RECENT_KEY='warera_panko_recent_v1';
  const me=(()=>{try{const v=localStorage.getItem(KEY);return v==='も'?'も':'み'}catch(e){return'み'}})(),partner=me==='み'?'も':'み';
  const name=partner==='み'?'みちゃこ（パン粉）':'もっち（パン粉）',avatar=partner==='み'?'../assets/avatars/mi.jpg':'../assets/avatars/mo.jpg';
  document.getElementById('partnerName').textContent=name;document.getElementById('partnerAvatar').src=avatar;
  const [rows,quiz]=await Promise.all([WareraData.memories('../'),WareraData.expandedQuiz('../')]);
  const list=document.getElementById('chatList'),panel=document.getElementById('chatPanel'),input=document.getElementById('input'),send=document.getElementById('send'),reset=document.getElementById('reset');
  const BAD=/(https?:\/\/|www\.|続きを読む|^\[|^<|株式会社|〒|@\w+|\{.{20,}\}|```)/i;
  const clean=t=>String(t||'').replace(/\u200e/g,'').trim();
  const ok=t=>{t=clean(t);return t&&t.length<=90&&!BAD.test(t)&&!t.includes('\n')};
  const normalize=t=>clean(t).toLowerCase().replace(/[\s　。、！？!?,.・…〜～ー―「」『』（）()\[\]【】]/g,'');
  const grams=t=>{const s=normalize(t),a=[];for(let i=0;i<s.length-1;i++)a.push(s.slice(i,i+2));return new Set(a)};
  const categories=[
    ['sleep',/ねむ|眠|寝|おやす|オフトゥン|起き/],['tired',/疲|つかれ|しんど|むり|無理|限界|だる/],['work',/仕事|しごと|会社|残業|会議|出勤|退勤|案件|面談|働/],['food',/腹|おなか|ごはん|飯|食べ|たべ|おいし|ランチ|夕飯|朝飯|ガラスープ/],['bath',/風呂|おふろ|シャワー|カラダ.?アラウ/],['lonely',/寂|さみし|会いた|あいた|ひとり|暇|ひま/],['sad',/悲|かなしい|泣|つら|落ち込|へこ/],['happy',/うれし|嬉|やった|最高|たのし|楽しい|よかった/],['cute',/かわい|可愛|すき|好き|愛/],['thanks',/ありがと|感謝|助かった/],['sorry',/ごめん|すまん|申し訳/],['morning',/おはよ|おは$|朝/],['night',/おやすみ|おやす|夜/],['home',/ただいま|帰宅|帰った|かえった|帰る/],['call',/電話|通話|でんわ|話したい|しゃべりたい/],['question',/[?？]|なに|何|どう|どこ|いつ|なんで|なぜ/],['laugh',/w{2,}|笑|草|www/]
  ];
  function cats(t){const out=[];for(const [k,re] of categories)if(re.test(clean(t)))out.push(k);return out}
  const patterns=[],fallback=[];
  function addPattern(prompt,replies,source='memory'){
    prompt=clean(prompt);replies=(replies||[]).map(clean).filter(ok).slice(0,3);if(!ok(prompt)||!replies.length)return;
    patterns.push({prompt,replies,cats:cats(prompt),g:grams(prompt),source});
    replies.forEach(r=>fallback.push({text:r,cats:cats(prompt)}));
  }
  for(const s of rows){const lines=(s.lines||[]).map(x=>({who:x.who,text:clean(x.text)})).filter(x=>(x.who==='み'||x.who==='も')&&ok(x.text));for(let i=0;i<lines.length;i++){
      const a=lines[i];if(a.who!==me)continue;const replies=[];for(let j=i+1;j<Math.min(lines.length,i+5);j++){if(lines[j].who===partner)replies.push(lines[j].text);else if(replies.length)break;else break}if(replies.length)addPattern(a.text,replies);
    }}
  for(const q of (quiz.next||[])){if(q.prompt_who===me&&q.answer_who===partner)addPattern(q.prompt,[q.answer],'quiz')}
  const unique=[];const seen=new Set();for(const p of patterns){const k=normalize(p.prompt)+'|'+p.replies.join('\u0001');if(!seen.has(k)){seen.add(k);unique.push(p)}}
  patterns.length=0;patterns.push(...unique);
  const fb=[];const fs=new Set();for(const x of fallback){if(!fs.has(x.text)){fs.add(x.text);fb.push(x)}}fallback.length=0;fallback.push(...fb);
  let recentReplies=[];try{recentReplies=JSON.parse(localStorage.getItem(RECENT_KEY)||'[]')}catch(e){}
  let history=[];try{history=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch(e){}if(!Array.isArray(history))history=[];history=history.filter(x=>x&&(x.who===me||x.who===partner)&&ok(x.text)).slice(-80);
  function rowNode(who,text,typing=false){const row=document.createElement('div');row.className='chat-line '+(who===me?'mine self':'other')+(typing?' panko-typing':'');const w=document.createElement('span');w.className='who';w.dataset.who=who;w.textContent=who;const b=document.createElement('div');b.className='bubble';b.textContent=text;if(who===me)row.append(b,w);else row.append(w,b);return row}
  function render(){list.replaceChildren();for(const h of history)list.append(rowNode(h.who,h.text));requestAnimationFrame(()=>panel.scrollTop=panel.scrollHeight)}
  function save(){localStorage.setItem(HISTORY_KEY,JSON.stringify(history.slice(-80)));localStorage.setItem(RECENT_KEY,JSON.stringify(recentReplies.slice(-50)))}
  function score(p,text,context){const ng=grams(text),pc=p.cats,ic=cats(text),cc=cats(context);let s=0;if(normalize(text)===normalize(p.prompt))s+=18;for(const c of ic)if(pc.includes(c))s+=5;for(const c of cc)if(pc.includes(c))s+=1.5;let hit=0;for(const g of ng)if(p.g.has(g))hit++;if(ng.size&&p.g.size)s+=10*hit/Math.max(ng.size,p.g.size);const a=normalize(text),b=normalize(p.prompt);if(a&&b&&(a.includes(b)||b.includes(a)))s+=5;if(Math.abs(a.length-b.length)<5)s+=.5;return s}
  function pickReply(text){const context=history.slice(-4).map(x=>x.text).join(' '),ranked=patterns.map(p=>({p,s:score(p,text,context)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);let pool=[];if(ranked.length&&ranked[0].s>=3){const cap=Math.min(ranked.length,Math.max(10,Math.round(ranked.length*.08)));pool=ranked.slice(0,cap)}else{const ic=cats(text),same=fallback.filter(x=>ic.some(c=>x.cats.includes(c)));pool=(same.length?same:fallback).map(x=>({p:{replies:[x.text]},s:1}))}
    const fresh=pool.filter(x=>x.p.replies.some(r=>!recentReplies.includes(r)));const src=fresh.length?fresh:pool;if(!src.length)return partner==='み'?'ほう':'ほう';const top=src.slice(0,Math.min(24,src.length));const weights=top.map((x,i)=>Math.max(.6,(x.s||1)+2/(i+1))),total=weights.reduce((a,b)=>a+b,0);let r=Math.random()*total,chosen=top[0];for(let i=0;i<top.length;i++){r-=weights[i];if(r<=0){chosen=top[i];break}}const reps=chosen.p.replies.filter(x=>!recentReplies.includes(x));const arr=reps.length?reps:chosen.p.replies;const first=arr[Math.floor(Math.random()*arr.length)];recentReplies.push(first);return first}
  function autoresize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px'}
  async function talk(){const text=clean(input.value);if(!text||send.disabled)return;history.push({who:me,text});input.value='';autoresize();render();save();send.disabled=true;const typing=rowNode(partner,'…',true);list.append(typing);panel.scrollTop=panel.scrollHeight;const reply=pickReply(text);await new Promise(r=>setTimeout(r,Math.min(1300,420+reply.length*24+Math.random()*320)));typing.remove();history.push({who:partner,text:reply});render();save();send.disabled=false;input.focus()}
  send.onclick=talk;input.addEventListener('input',autoresize);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();talk()}});reset.onclick=()=>{history=[];recentReplies=[];save();render();input.focus()};
  render();autoresize();
})();
</script></body></html>
