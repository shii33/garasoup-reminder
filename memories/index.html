<!DOCTYPE html><html lang="ja" class="notranslate" translate="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><meta name="robots" content="noindex,nofollow,noarchive"><title>たまには思い出そうず｜我らのあそび場</title><link rel="stylesheet" href="../assets/site.css"><style>.memory-around{display:grid;gap:14px}.memory-block{padding:14px;border:1px solid #ddd;border-radius:10px;background:#fafafa}.memory-block.is-current{border-color:#111;background:#fff;box-shadow:2px 2px 0 rgba(0,0,0,.2)}.memory-label{font-size:11px;font-weight:800;color:#777;margin-bottom:10px}.memory-block.is-current .memory-label{color:#111}.memory-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}</style></head><body><header class="site-header"><div class="site-header__inner"><a class="brand" href="../">我らのあそび場</a><button class="lock-btn" data-lock>鍵をかける</button></div></header><main class="shell app-shell conversation-shell"><div class="backline"><a href="../">← あそび場にもどる</a></div><section class="app-title"><div class="icon">💬</div><div><h1>たまには思い出そうず</h1><p>過去ログから、昔のわれわれを1場面。</p></div></section><div style="height:24px"></div><section class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px"><span class="chip" id="date">---</span></div><div id="scene" style="min-height:220px"></div><div class="memory-actions" id="actions"><button class="press-btn primary" id="next">もういっこ</button><button class="press-btn" id="around">この周辺を見る</button><a class="press-btn" id="openDay" style="display:inline-flex;align-items:center;text-decoration:none" href="#">あの日のわれわれで開く</a></div></section></main><script src="../assets/auth.js"></script><script src="../assets/common.js"></script><script src="../assets/data.js"></script><script>
(async()=>{
  wireLock('../');
  const memories=await WareraData.memories('../');
  const readable=memories.filter(WareraData.readableScene);
  const source=readable.length?readable:memories;
  const grouped=new Map();
  memories.forEach(x=>{if(!grouped.has(x.date))grouped.set(x.date,[]);grouped.get(x.date).push(x)});
  const scene=document.getElementById('scene'),date=document.getElementById('date'),next=document.getElementById('next'),around=document.getElementById('around'),openDay=document.getElementById('openDay');
  const RK='warera_memory_recent';
  let current=null,aroundMode=false;

  function chatNode(item){
    const wrap=document.createElement('div');wrap.className='chat-scene';
    (item?.lines||[]).forEach(x=>{const row=document.createElement('div');row.className='chat-line '+(x.who==='み'?'mine':'theirs');const w=document.createElement('span');w.className='who';w.textContent=x.who;const bub=document.createElement('div');bub.className='bubble';bub.textContent=x.text;x.who==='み'?row.append(bub,w):row.append(w,bub);wrap.append(row)});
    return wrap;
  }
  function dayPool(item){
    const all=grouped.get(item.date)||[];
    const r=all.filter(WareraData.readableScene);
    return r.length?r:all;
  }
  function renderSingle(item){
    current=item;aroundMode=false;date.textContent=(item.date||'').replaceAll('-','.');scene.replaceChildren();scene.append(chatNode(item));
    around.textContent='この周辺を見る';
    openDay.href=`../on-this-day/?date=${encodeURIComponent(item.date)}&scene=${encodeURIComponent(item.id)}&around=1`;
  }
  function renderAround(item){
    current=item;aroundMode=true;date.textContent=(item.date||'').replaceAll('-','.');scene.replaceChildren();
    const pool=dayPool(item),idx=pool.findIndex(x=>String(x.id)===String(item.id));
    const wrap=document.createElement('div');wrap.className='memory-around';
    if(idx<0){wrap.append(chatNode(item));scene.append(wrap);return}
    const from=Math.max(0,idx-1),to=Math.min(pool.length-1,idx+1);
    for(let i=from;i<=to;i++){
      const block=document.createElement('section');block.className='memory-block'+(i===idx?' is-current':'');
      const label=document.createElement('div');label.className='memory-label';label.textContent=i===idx?'いま引いた場面':i<idx?'少し前':'少しあと';
      block.append(label,chatNode(pool[i]));wrap.append(block);
    }
    scene.append(wrap);around.textContent='1場面に戻す';
    openDay.href=`../on-this-day/?date=${encodeURIComponent(item.date)}&scene=${encodeURIComponent(item.id)}&around=1`;
  }
  async function pick(){
    next.disabled=true;
    try{
      let recent=[];try{recent=JSON.parse(localStorage.getItem(RK)||'[]')}catch(e){}
      const recentSet=new Set(recent);
      let pool=source.filter(x=>!recentSet.has(String(x.id)));
      if(!pool.length){recent=[];pool=source}
      const chosen=pool[Math.floor(Math.random()*pool.length)];
      if(!chosen)return;
      recent.push(String(chosen.id));localStorage.setItem(RK,JSON.stringify(recent.slice(-30)));
      renderSingle(chosen);
    }finally{next.disabled=false}
  }
  around.onclick=()=>{if(!current)return;aroundMode?renderSingle(current):renderAround(current)};
  next.onclick=pick;pick();
})();
</script></body></html>
