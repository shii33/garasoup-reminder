<!DOCTYPE html><html lang="ja" class="notranslate" translate="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><meta name="robots" content="noindex,nofollow,noarchive"><title>われわれ国語辞典｜我らのあそび場</title><link rel="stylesheet" href="../assets/site.css"><style>@media(max-width:580px){input,textarea,select{font-size:16px!important}}</style></head><body><header class="site-header"><div class="site-header__inner"><a class="brand" href="../">我らのあそび場</a><button class="lock-btn" data-lock>鍵をかける</button></div></header><main class="shell app-shell"><div class="backline"><a href="../">← あそび場にもどる</a></div><section class="app-title"><div class="icon">📖</div><div><h1>われわれ国語辞典</h1><p>いつの間にか通じるようになった言葉。</p></div><span class="source-count" id="sourceCount"></span></section><div style="height:24px"></div><section class="toolbar"><div class="search"><input id="wordSearch" type="search" placeholder="ことばを探す"><svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg></div><div class="filters"><button class="press-btn" id="randomWord">ランダム1語</button></div></section><div class="section-head"><h2>採録語</h2><span id="wordCount"></span></div><section class="dictionary-list" id="wordList"></section></main><script src="../assets/auth.js"></script><script src="../assets/common.js"></script><script src="../assets/data.js"></script><script>(async()=>{wireLock('../');const d=(await WareraData.core('../')).dictionary,list=document.getElementById('wordList'),q=document.getElementById('wordSearch'),cnt=document.getElementById('wordCount');document.getElementById('sourceCount').textContent=`採録${Number(d.entries?.length||0).toLocaleString()}語`;function card(x){const aliases=(x.aliases||[]).length?`<div class="aliases">別名・派生：${x.aliases.map(esc).join(' ／ ')}</div>`:'';const meta=[x.first_date?`初出 ${fmtDate(x.first_date)}`:'初出不明',`${x.count}回`].join(' ／ ');const ex=(x.examples||[]).map(e=>`<div class="subtle" style="margin:7px 0"><b>${e.who}</b> ${fmtDate(e.date)}<br>${esc(e.text).replaceAll('\n','<br>')}</div>`).join('');return `<article class="word-card"><div class="word-head"><div><div class="word">${esc(x.term)}</div>${aliases}<div class="subtle" style="margin-top:5px">${meta}</div></div><span class="pos">${esc(x.pos)}</span></div><p style="font-size:13px;line-height:1.8;margin:13px 0 0">${esc(x.definition)}</p>${ex?`<div class="examples">${ex}</div>`:''}</article>`}function render(items=d.entries){cnt.textContent=`${items.length}語`;list.innerHTML=items.map(card).join('')||'<div class="empty">見つからんかった。</div>'}q.oninput=()=>{const s=q.value.trim().toLowerCase();render(d.entries.filter(x=>(x.term+' '+(x.aliases||[]).join(' ')+' '+x.definition+' '+x.pos).toLowerCase().includes(s)))};document.getElementById('randomWord').onclick=()=>{const x=d.entries[Math.floor(Math.random()*d.entries.length)];q.value=x.term;render([x]);window.scrollTo({top:180,behavior:'smooth'})};render()})()</script></body></html>
