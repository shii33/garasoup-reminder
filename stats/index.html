<!DOCTYPE html><html lang="ja" class="notranslate" translate="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><meta name="robots" content="noindex,nofollow,noarchive"><title>われわれ統計｜我らのあそび場</title><link rel="stylesheet" href="../assets/site.css"><style>.mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mini-stat{border:1px solid #ddd;border-radius:10px;background:#fff;padding:13px}.mini-stat b{display:block;font-size:18px;margin-top:4px}.rank-list{display:grid;gap:8px}.rank-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eee}.rank-row:last-child{border-bottom:0}.anniv-row{padding:12px 0;border-bottom:1px solid #eee}.anniv-row:last-child{border-bottom:0}.anniv-row b{display:block;margin-bottom:3px}.anniv-row span{font-size:12px;color:#666}@media(max-width:580px){.mini-grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="site-header__inner"><a class="brand" href="../">我らのあそび場</a><button class="lock-btn" data-lock>鍵をかける</button></div></header><main class="shell app-shell app-wide"><div class="backline"><a href="../">← あそび場にもどる</a></div><section class="app-title"><div class="icon">📊</div><div><h1>われわれ統計</h1><p>ログを無駄にちゃんと数える。</p></div><span class="source-count" id="sourceCount"></span></section><div style="height:24px"></div><section class="stat-grid" id="statGrid"></section><section class="panel"><div class="section-head" style="margin-top:0"><h2>どっちがどれくらい送ってる</h2></div><div id="senderBars"></div></section><section class="panel"><div class="section-head" style="margin-top:0"><h2>何時に送ってる</h2><span id="peakHour"></span></div><div id="hourBars"></div></section><section class="panel"><div class="section-head" style="margin-top:0"><h2>曜日と時間帯</h2></div><div class="mini-grid" id="timeGrid"></div></section><section class="panel"><div class="section-head" style="margin-top:0"><h2>どうでもいい記録</h2></div><div class="mini-grid" id="recordGrid"></div></section><section class="panel"><div class="section-head" style="margin-top:0"><h2>メッセージが多かった日</h2></div><div class="rank-list" id="topDays"></div></section><section class="panel"><div class="section-head" style="margin-top:0"><h2>どうでもいい記念日</h2><span>ログから勝手に制定</span></div><div id="anniversaries"></div></section><section class="panel"><div class="section-head" style="margin-top:0"><h2>無駄に数えたもの</h2><span>かなり増やした</span></div><div class="grid" id="funGrid"></div></section><p class="subtle" id="note" style="margin-top:18px"></p></main><script src="../assets/auth.js"></script><script src="../assets/common.js"></script><script src="../assets/data.js"></script><script>(async()=>{
  wireLock('../');const [core,a,state]=await Promise.all([WareraData.core('../'),WareraData.expandedAnalytics('../'),fetch('../scripts/state.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)]),d=(a&&a.counts)?a:core.stats;const last=state?.last_processed||'';if(last){const dt=new Date(last);document.getElementById('sourceCount').textContent=`${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}まで反映`}else{const end=d.period?.end||'';document.getElementById('sourceCount').textContent=end?`${end.replaceAll('-','/')}まで反映`:'反映日不明'};
  const cards=[['テキストメッセージ',d.counts.text_messages.toLocaleString()+'通'],['ログ期間',d.period.days+'日'],['音声・ビデオ通話',d.counts.calls.toLocaleString()+'回'],['通話時間',d.counts.call_hours.toLocaleString()+'時間'],['1日平均',d.counts.avg_text_per_day+'通'],['最多の日',d.peak_day.date.slice(5).replace('-','/')+'・'+d.peak_day.count+'通'],['最長通話',fmtMinutes(d.longest_call.minutes)],['最長ラリー',d.rapid_rally.messages+'通']];document.getElementById('statGrid').innerHTML=cards.map(x=>`<div class="stat"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('');
  const total=d.by_sender.reduce((s,x)=>s+x.count,0);document.getElementById('senderBars').innerHTML=d.by_sender.map(x=>`<div class="bar-row"><b>${x.who}</b><div class="bar"><i style="width:${x.count/total*100}%"></i></div><span>${x.count.toLocaleString()}通</span></div>`).join('');const max=Math.max(...d.hours.map(x=>x.count));document.getElementById('hourBars').innerHTML=d.hours.map(x=>`<div class="bar-row"><span>${String(x.hour).padStart(2,'0')}時</span><div class="bar"><i style="width:${max?x.count/max*100:0}%"></i></div><span>${x.count.toLocaleString()}</span></div>`).join('');document.getElementById('peakHour').textContent=`ピーク ${d.peak_hour.hour}時台`;
  document.getElementById('timeGrid').innerHTML=[...(a.weekday||[]).map(x=>[`${x.label}曜日`,x.count.toLocaleString()+'通']),...(a.time_buckets||[]).map(x=>[x.label,x.count.toLocaleString()+'通'])].map(x=>`<div class="mini-stat"><span class="subtle">${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('');
  const rec=[];if(a.longest_message?.chars)rec.push(['最長メッセージ',`${a.longest_message.who}・${a.longest_message.chars.toLocaleString()}文字`]);if(a.max_streak?.messages)rec.push(['連投最多',`${a.max_streak.who}・${a.max_streak.messages}通`]);if(a.longest_gap?.hours)rec.push(['最長無言期間',`${Math.round(a.longest_gap.hours/24*10)/10}日`]);if(a.counts?.questions!=null)rec.push(['？の数',a.counts.questions.toLocaleString()]);if(a.counts?.exclamations!=null)rec.push(['！の数',a.counts.exclamations.toLocaleString()]);if(a.counts?.w_chars!=null)rec.push(['w の総文字数',a.counts.w_chars.toLocaleString()]);(a.reply||[]).forEach(x=>rec.push([`${x.direction} 平均返信`,x.avg_seconds<60?`${Math.round(x.avg_seconds)}秒`:`${Math.round(x.avg_seconds/60*10)/10}分`]));document.getElementById('recordGrid').innerHTML=rec.map(x=>`<div class="mini-stat"><span class="subtle">${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('');
  document.getElementById('topDays').innerHTML=(a.top_days||[]).slice(0,10).map((x,i)=>`<div class="rank-row"><span>${i+1}. ${fmtDate(x.date)}</span><b>${x.count.toLocaleString()}通</b></div>`).join('');
  const curatedAnniversaries=[
    {label:'5時間通話、記録更新',date:'2026-06-04',detail:'その時点での最長通話・5時間'},
    {label:'9時間通話、記録更新',date:'2026-06-05',detail:'翌日さらに4時間更新'},
    {label:'われわれがわれわれになった日',date:'2026-06-18',detail:'「われわれ、ね」→8秒後に「われわれもだけど」'},
    {label:'10時間通話、記録更新',date:'2026-06-23',detail:'その時点での最長通話・10時間'},
    {label:'「今日もかわいかったぞ」初出',date:'2026-07-27',detail:'のちに繰り返し登場する締めのひとこと'},
    {label:'しょもしょも誕生',date:'2026-07-30',detail:'み「しょもしょも…」'},
    {label:'おけけ、もっちに感染',date:'2026-08-10',detail:'み発の「おけけ」を、もが初使用'},
    {label:'しょもしょも、もっちに感染',date:'2026-08-15',detail:'み発の「しょもしょも」を、もが初使用'},
    {label:'カラダ・アラウ継承記念日',date:'2026-08-31',detail:'5月からのみ語を、もが初使用'},
    {label:'ガラスープ爆誕',date:'2026-09-21',detail:'「鶏ガラスープない」から全部が始まった'}
  ];
  const autoAnniversaries=(a.anniversaries||[]).filter(x=>{const label=String(x.label||x.title||'');return !label.includes('よくしゃべった日')&&!label.includes('一番しゃべった日')&&!label.includes('よく喋った日')&&!label.includes('一番喋った日')});
  const anniversaries=[...curatedAnniversaries,...autoAnniversaries.filter(x=>!curatedAnniversaries.some(y=>y.date===x.date&&(y.label===x.label||y.label===x.title)))].sort((x,y)=>String(x.date).localeCompare(String(y.date)));
  document.getElementById('anniversaries').innerHTML=anniversaries.slice(0,24).map(x=>`<div class="anniv-row"><b>${esc(x.label||x.title||'記念日')}</b><span>${fmtDate(x.date)}${x.detail?' ／ '+esc(x.detail):''}</span></div>`).join('')||'<div class="empty">まだ制定されてない。</div>';
  document.getElementById('funGrid').innerHTML=(a.fun||[]).map(x=>`<div class="stat"><div class="label">${esc(x.label)}</div><div class="value">${x.count.toLocaleString()}</div></div>`).join('');document.getElementById('note').textContent=(d.note||'')+'　詳細内訳は手元の全ログ範囲を基準に集計。総数は最新ログまで反映済み。'
})()</script></body></html>
