<!DOCTYPE html><html lang="ja" class="notranslate" translate="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><meta name="robots" content="noindex,nofollow,noarchive"><title>われわれ統計｜我らのあそび場</title><link rel="stylesheet" href="../assets/site.css"><style>.mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mini-stat{border:1px solid #ddd;border-radius:10px;background:#fff;padding:13px}.mini-stat b{display:block;font-size:18px;margin-top:4px}.rank-list{display:grid;gap:8px}.rank-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eee}.rank-row:last-child{border-bottom:0}@media(max-width:580px){.mini-grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="site-header__inner"><a class="brand" href="../">我らのあそび場</a><button class="lock-btn" data-lock>鍵をかける</button></div></header><main class="shell app-shell app-wide"><div class="backline"><a href="../">← あそび場にもどる</a></div><section class="app-title"><div class="icon">📊</div><div><h1>われわれ統計</h1><p>ログを無駄にちゃんと数える。</p></div></section><div style="height:24px"></div><section class="stat-grid" id="statGrid"></section><section class="panel"><div class="section-head" style="margin-top:0"><h2>どっちがどれくらい送ってる</h2></div><div id="senderBars"></div></section><section class="panel"><div class="section-head" style="margin-top:0"><h2>何時にしゃべってる</h2><span id="peakHour"></span></div><div id="hourBars"></div></section><section class="panel"><div class="section-head" style="margin-top:0"><h2>曜日と時間帯</h2></div><div class="mini-grid" id="timeGrid"></div></section><section class="panel"><div class="section-head" style="margin-top:0"><h2>どうでもいい記録</h2></div><div class="mini-grid" id="recordGrid"></div></section><section class="panel"><div class="section-head" style="margin-top:0"><h2>よく喋った日</h2></div><div class="rank-list" id="topDays"></div></section><section class="panel"><div class="section-head" style="margin-top:0"><h2>無駄に数えたもの</h2><span>増やしました</span></div><div class="grid" id="funGrid"></div></section><p class="subtle" id="note" style="margin-top:18px"></p></main><script src="../assets/auth.js"></script><script src="../assets/common.js"></script><script src="../assets/data.js"></script><script>(async()=>{wireLock('../');const d=(await WareraData.core('../')).stats;const g=document.getElementById('statGrid');const cards=[['テキスト発言',d.counts.text_messages.toLocaleString()+'通'],['ログ期間',d.period.days+'日'],['音声・ビデオ通話',d.counts.calls.toLocaleString()+'回'],['通話時間',d.counts.call_hours.toLocaleString()+'時間'],['1日平均',d.counts.avg_text_per_day+'通'],['最多の日',d.peak_day.date.slice(5).replace('-','/')+'・'+d.peak_day.count+'通'],['最長通話',fmtMinutes(d.longest_call.minutes)],['最長ラリー',d.rapid_rally.messages+'通']];g.innerHTML=cards.map(x=>`<div class="stat"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('');const total=d.by_sender.reduce((a,x)=>a+x.count,0),sb=document.getElementById('senderBars');sb.innerHTML=d.by_sender.map(x=>`<div class="bar-row"><b>${x.who}</b><div class="bar"><i style="width:${x.count/total*100}%"></i></div><span>${x.count.toLocaleString()}通</span></div>`).join('');const max=Math.max(...d.hours.map(x=>x.count)),hb=document.getElementById('hourBars');hb.innerHTML=d.hours.map(x=>`<div class="bar-row"><span>${String(x.hour).padStart(2,'0')}時</span><div class="bar"><i style="width:${max?x.count/max*100:0}%"></i></div><span>${x.count.toLocaleString()}</span></div>`).join('');document.getElementById('peakHour').textContent=`ピーク ${d.peak_hour.hour}時台`;const week=d.weekday||[],buckets=d.time_buckets||[];document.getElementById('timeGrid').innerHTML=[...week.map(x=>[`${x.label}曜日`,x.count.toLocaleString()+'通']),...buckets.map(x=>[x.label,x.count.toLocaleString()+'通'])].map(x=>`<div class="mini-stat"><span class="subtle">${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('')||'<div class="empty">次回の全量更新で増えるよ。</div>';const rec=[];if(d.longest_message?.chars)rec.push(['最長メッセージ',`${d.longest_message.who}・${d.longest_message.chars.toLocaleString()}文字`]);if(d.max_streak?.messages)rec.push(['連投最多',`${d.max_streak.who}・${d.max_streak.messages}通`]);if(d.longest_gap?.hours)rec.push(['最長無言期間',`${Math.round(d.longest_gap.hours/24*10)/10}日`]);if(d.counts.questions!=null)rec.push(['？の数',d.counts.questions.toLocaleString()]);if(d.counts.exclamations!=null)rec.push(['！の数',d.counts.exclamations.toLocaleString()]);if(d.counts.w_chars!=null)rec.push(['w の総文字数',d.counts.w_chars.toLocaleString()]);(d.reply||[]).forEach(x=>rec.push([`${x.direction} 平均返信`,x.avg_seconds<60?`${Math.round(x.avg_seconds)}秒`:`${Math.round(x.avg_seconds/60*10)/10}分`]));document.getElementById('recordGrid').innerHTML=rec.map(x=>`<div class="mini-stat"><span class="subtle">${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('')||'<div class="empty">次回の全量更新で増えるよ。</div>';document.getElementById('topDays').innerHTML=(d.top_days||[]).slice(0,10).map((x,i)=>`<div class="rank-row"><span>${i+1}. ${fmtDate(x.date)}</span><b>${x.count.toLocaleString()}通</b></div>`).join('');document.getElementById('funGrid').innerHTML=(d.fun||[]).map(x=>`<div class="stat"><div class="label">${esc(x.label)}</div><div class="value">${x.count.toLocaleString()}</div></div>`).join('');document.getElementById('note').textContent=d.note||''})()</script></body></html>
