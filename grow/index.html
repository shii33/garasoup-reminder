<body>

<div class="grow-shell">

<div class="lcd-top"><span id="lcdClock">--:--</span><span id="lcdStage">たまご</span><span class="attention" id="attention">!</span></div>

<div class="home-screen"><div>

</div></div>
</div>

<button class="icon-btn" data-menu="food" aria-label="ごはん">🍚<span>FOOD</span></button>
<button class="icon-btn" data-menu="care" aria-label="お世話">✦<span>CARE</span></button>

</div></div>

</div>
</main>

.[0]).filter(Boolean).join(' / ')||'まだクセ薄め'}`,105,1098);const learned=Object.entries(state.learned||{}).sort((a,b)=>b[1]-a[1]).slice(0,5);x.fillText(`おぼえたことば：${learned.length?learned.map(([w,n])=>`${w}×${n}`).join(' / '):'まだなし'}`,105,1141);x.fillStyle='#777';x.font='20px sans-serif';x.fillText(`お世話 ${state.totalCare}回 / ${stageFor().label}`,105,1200);const blob=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('画像を作れなかった')),'image/png')),file=new File([blob],`warera-pet-${target}-${today()}.png`,{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e?.name==='AbortError')return}}if(navigator.clipboard&&window.ClipboardItem){try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);alert('画像をコピーしたよ');return}catch(e){}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function boot(){viewer=getViewer();target=viewer==='み'?'も':'み';state=await load();migrate();applyDecay();quotes=buildQuotes();innate=buildInnate();if(!state.lastSpeech)state.lastSpeech=stageSpeech();await save();render();openMenu('home')}
els.iconMenu.addEventListener('click',e=>{const b=e.target.closest('[data-menu]');if(!b)return;selectedIcon=[...els.iconMenu.querySelectorAll('.icon-btn')].indexOf(b);openMenu(b.dataset.menu)});
els.actionOptions.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)care(b.dataset.action,b.dataset.extra||'')});
document.getElementById('btnA').onclick=()=>{if(['food','care','sleep','word'].includes(menu)){const opts=[...els.actionOptions.querySelectorAll('.lcd-option')];if(opts.length){selectedOption=(selectedOption+1)%opts.length;opts.forEach((b,i)=>b.classList.toggle('is-selected',i===selectedOption))}}else{selectIcon(1)}};
document.getElementById('btnB').onclick=()=>confirmSelection();document.getElementById('btnC').onclick=()=>openMenu('home');
document.getElementById('shareBtn').onclick=async e=>{const b=e.currentTarget;b.disabled=true;try{await sharePet()}finally{b.disabled=false}};document.getElementById('growthClose').onclick=()=>els.growthPop.hidden=true;els.growthPop.onclick=e=>{if(e.target===els.growthPop)els.growthPop.hidden=true};
document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'warera-grow',version:7,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`warera-grow-${viewer}-${target}-${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text()),x=d.state||d;if(!x?.born||!x?.traits)throw 0;state=x;migrate();await save();render();openMenu('home');alert('復元したよ')}catch(err){alert('この育成データは読み込めなかった')}finally{e.target.value=''}};
await boot();let seenViewer=viewer;setInterval(async()=>{const v=getViewer();if(v!==seenViewer){seenViewer=v;await boot();return}applyDecay();renderClock();renderHome();if(menu==='status')renderStatus()},30000);
})();
