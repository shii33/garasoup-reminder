t.stage-baby .pet-ear.left{left:24px}.pet.stage-baby .pet-ear.right{right:24px}.pet.stage-baby .pet-feet{gap:29px}.pet.stage-baby .pet-foot{width:28px;height:14px}.pet.stage-baby .pet-accessory{right:-5px;top:42px;width:35px;height:35px;font-size:17px}.pet.stage-child{transform:scale(1.05)}.pet.stage-adult{transform:scale(1.13)}.pet[data-vibe="playful"] .pet-ear.left{transform:rotate(-32deg)}.pet[data-vibe="playful"] .pet-ear.right{transform:rotate(32deg)}.pet[data-vibe="sleepy"] .pet-eye{height:4px;margin-top:7px;border-radius:999px}.pet[data-vibe="affection"] .pet-mouth{width:17px;height:12px;border:0;background:#111;clip-path:polygon(50% 100%,0 38%,12% 5%,50% 27%,88% 5%,100% 38%)}.pet[data-vibe="independent"] .pet-mouth{width:20px;height:2px;margin-top:20px;border:0;background:#111;border-radius:999px}.pet[data-vibe="weird"] .pet-eye:first-child{height:8px;margin-top:4px}.pet[data-vibe="food"] .pet-mouth{width:24px;height:14px;border:2px solid #111;border-top:0}.stage-label{position:absolute;right:10px;bottom:9px;z-index:3;padding:3px 6px;border:1px solid #111;border-radius:999px;background:#fff;font-size:8px;font-weight:800}.action-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.care-btn{min-width:0;padding:9px 5px!important;font-size:10px!important;line-height:1.2}.care-btn span{display:block;font-size:17px;margin-bottom:3px}.care-btn:disabled{opacity:.38;cursor:not-allowed}.teach-panel{display:none;margin-top:8px;padding:10px;border:1px dashed #999;border-radius:9px;background:#fafafa}.teach-panel.is-show{display:block}.teach-panel b{display:block;margin-bottom:7px;font-size:10px}.teach-choices{display:flex;flex-wrap:wrap;gap:6px}.teach-word{padding:6px 8px;border:1px solid #111;border-radius:999px;background:#fff;font:inherit;font-size:10px;font-weight:700;cursor:pointer}.status-panel{display:grid;gap:10px}.mini-panel{padding:13px;border:1px solid #111;border-radius:10px;background:#fff;box-shadow:3px 3px 0 rgba(0,0,0,.25)}.mini-panel h2{margin:0 0 8px;font-size:12px}.trait-tags{display:flex;flex-wrap:wrap;gap:5px}.trait-tag{padding:4px 7px;border:1px solid #111;border-radius:999px;background:#f7f7f7;font-size:9px;font-weight:700}.profile-grid{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:10px}.profile-grid dt{color:#777}.profile-grid dd{margin:0;font-weight:700}.memory-mail{padding:10px;border:1px dashed #999;border-radius:8px;background:#fafafa}.memory-mail small{display:block;color:#777;font-size:8px}.memory-mail p{margin:5px 0 0;font-size:10px;line-height:1.55}.history{display:grid;gap:6px;max-height:150px;overflow:auto}.history-row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:7px;padding-bottom:5px;border-bottom:1px solid #eee;font-size:9px;line-height:1.4}.history-row time{color:#777}.data-actions{display:flex;flex-wrap:wrap;gap:6px}.data-actions .press-btn{font-size:9px!important;min-height:32px!important;padding:6px 8px!important}.growth-pop{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:22px;background:rgba(244,244,244,.9)}.growth-pop[hidden]{display:none}.growth-card{width:min(100%,340px);padding:24px;border:2px solid #111;border-radius:12px;background:#fff;text-align:center;box-shadow:5px 5px 0 rgba(0,0,0,.4)}.growth-card .big{font-size:50px}.growth-card h2{margin:8px 0 4px;font-size:24px}.growth-card p{margin:0 0 15px;color:#666;font-size:11px}.growth-card .press-btn{width:100%}

</style></head><body><header class="site-header"><div class="site-header__inner"><a class="brand" href="../">我らのあそび場</a><button class="lock-btn" data-lock>鍵をかける</button></div></header><main class="shell app-shell conversation-shell"><div class="backline"><a href="../">← あそび場にもどる</a></div><section class="app-title"><div class="icon">🥚</div><div><h1>われわれ育成所</h1><p>相手を、勝手に育てる。</p></div></section><div class="grow-grid"><section class="pet-panel"><div class="pet-top"><div class="pet-title"><b id="petName">---</b><span id="petSub">この端末だけの個体</span></div><div class="care-left">今日あと <b id="careLeft">3</b> 回 <span class="care-dots" id="careDots"></span></div></div><div class="habitat"><div class="speech" id="speech">……</div><div class="pet-wrap"><div class="pet stage-egg" id="pet"><div class="pet-ear left"></div><div class="pet-ear right"></div><div class="pet-body"><div class="egg-mark"></div><div class="pet-face"><div class="pet-eyes"><span class="pet-eye"></span><span class="pet-eye"></span></div><div class="pet-mouth"></div></div></div><div class="pet-feet"><span class="pet-foot"></span><span class="pet-foot"></span></div><div class="pet-accessory" id="petAccessory">💗</div></div><span class="stage-label" id="stageLabel">たまご</span></div></div><div class="action-grid" id="actionGrid"><button class="press-btn care-btn" data-action="feed"><span>🍚</span>ごはん</button><button class="press-btn care-btn" data-action="pat"><span>🫳</span>なでる</button><button class="press-btn care-btn" data-action="play"><span>🎲</span>あそぶ</button><button class="press-btn care-btn" data-action="sleep"><span>💤</span>ねかせる</button><button class="press-btn care-btn" data-action="poke"><span>👉</span>つつく</button><button class="press-btn care-btn" data-action="teach"><span>🗣️</span>ことば</button><button class="press-btn care-btn" data-action="memory"><span>📼</span>思い出</button><button class="press-btn care-btn" id="observeBtn"><span>👀</span>様子みる</button></div><div class="teach-panel" id="teachPanel"><b>どれを教える？</b><div class="teach-choices" id="teachChoices"></div></div></section><aside class="status-panel"><section class="mini-panel"><h2>この個体について</h2><dl class="profile-grid"><dt>育ててる人</dt><dd id="viewerName">---</dd><dt>育てられてる人</dt><dd id="targetName">---</dd><dt>生まれた日</dt><dd id="bornDate">---</dd><dt>お世話</dt><dd id="careTotal">0回</dd><dt>成長</dt><dd id="growthText">---</dd></dl></section><section class="mini-panel"><h2>今わかっていること</h2><div class="trait-tags" id="traitTags"></div></section><section class="mini-panel"><h2>過去の本人から届いた</h2><div class="memory-mail" id="memoryMail"><small>---</small><p>まだ何も届いてない。</p></div></section><section class="mini-panel history-panel"><h2>成長記録</h2><div class="history" id="history"></div></section><section class="mini-panel data-panel"><h2>育成データ</h2><div class="data-actions"><button class="press-btn" id="exportBtn">バックアップ</button><button class="press-btn" id="importBtn">復元</button><input id="importFile" type="file" accept="application/json" hidden></div></section></aside></div></main><div class="growth-pop" id="growthPop" hidden><div class="growth-card"><div class="big" id="growthEmoji">🐣</div><h2>成長した！</h2><p id="growthMessage"></p><button class="press-btn primary" id="growthClose">見にいく</button></div></div><script src="../assets/auth.js"></script><script src="../assets/common.js"></script><script src="../assets/data.js"></script><script>
(async()=>{
wireLock('../');
const KEY_PREFIX='warera_grow_v1_';const DB_NAME='warera-grow';const STORE='pets';const DAILY_LIMIT=3;
const names={み:'みちゃこ',も:'もっち'},stages=[{key:'egg',label:'たまご',min:0},{key:'baby',label:'あかちゃん',min:3},{key:'child',label:'こども',min:12},{key:'adult',label:'おとな',min:27}];
const traits=['affection','playful','food','routine','weird','independent','nostalgia','night'];
const traitMeta={affection:['甘やかされ','💗'],playful:['かまわれ好き','🎮'],food:['食いしん坊','🍙'],routine:['生活優等生','🛏️'],weird:['われわれ汚染','🌀'],independent:['自立型','🌱'],nostalgia:['思い出好き','📼'],night:['夜型','🌙']};
const wordSeeds=['われわれ','しょもしょも','おけけ','オフトゥン','てぇてぇ','はすはす','ガラスープ','かわいい','好き','ねむい','ごはん','だん！'];
const els={pet:document.getElementById('pet'),petName:document.getElementById('petName'),petSub:document.getElementById('petSub'),speech:document.getElementById('speech'),stageLabel:document.getElementById('stageLabel'),accessory:document.getElementById('petAccessory'),careLeft:document.getElementById('careLeft'),careDots:document.getElementById('careDots'),viewerName:document.getElementById('viewerName'),targetName:document.getElementById('targetName'),bornDate:document.getElementById('bornDate'),careTotal:document.getElementById('careTotal'),growthText:document.getElementById('growthText'),traitTags:document.getElementById('traitTags'),history:document.getElementById('history'),memoryMail:document.getElementById('memoryMail'),teachPanel:document.getElementById('teachPanel'),teachChoices:document.getElementById('teachChoices'),growthPop:document.getElementById('growthPop'),growthEmoji:document.getElementById('growthEmoji'),growthMessage:document.getElementById('growthMessage')};
let memories=[];try{memories=await WareraData.memories('../')}catch(e){}let viewer=getViewer(),target=viewer==='み'?'も':'み',state=null,lastStage=null;
function getViewer(){try{const v=localStorage.getItem('warera_chat_perspective');return v==='も'?'も':'み'}catch(e){return'み'}}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function stamp(){const d=new Date();return `${today()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function daysBetween(a,b){if(!a||!b)return 0;return Math.max(0,Math.floor((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000))}
function key(){return `${KEY_PREFIX}${viewer}_${target}`}
function fresh(){const t={};traits.forEach(x=>t[x]=0);return{id:key(),version:1,viewer,target,born:today(),lastVisit:today(),dailyDate:today(),dailyUsed:0,totalCare:0,traits:t,learned:{},history:[{at:stamp(),text:`${names[target]}のたまごを拾った`}],lastSpeech:'……中にいる。',lastStage:'egg'}}
function openDb(){return new Promise((resolve,reject)=>{try{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}catch(e){reject(e)}})}
async function load(){let x=null;try{const db=await openDb();x=await new Promise((res,rej)=>{const q=db.transaction(STORE,'readonly').objectStore(STORE).get(key());q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)});db.close()}catch(e){}if(!x){try{x=JSON.parse(localStorage.getItem(key())||'null')}catch(e){}}return x||fresh()}
async function save(){state.id=key();state.viewer=viewer;state.target=target;try{localStorage.setItem(key(),JSON.stringify(state))}catch(e){}try{const db=await openDb();await new Promise((res,rej)=>{const q=db.transaction(STORE,'readwrite').objectStore(STORE).put(state);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)});db.close()}catch(e){}}
function stageFor(n=state.totalCare){let s=stages[0];for(const x of stages)if(n>=x.min)s=x;return s}
function dominant(){return traits.slice().sort((a,b)=>(state.traits[b]||0)-(state.traits[a]||0))[0]||'affection'}
function addTrait(k,n=1){state.traits[k]=(state.traits[k]||0)+n}
function history(text){state.history.unshift({at:stamp(),text});state.history=state.history.slice(0,80)}
function partnerQuotes(){const out=[];for(const r of memories){for(const l of(r.lines||[])){if(l.who===target&&String(l.text||'').trim().length>=2&&String(l.text||'').trim().length<=60)out.push({date:r.date,text:String(l.text).trim()})}}return out}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function dailyQuote(){const q=partnerQuotes();return q.length?q[hash(today()+target)%q.length]:null}
function teachWords(){const lines=partnerQuotes().map(x=>x.text).join('\n');const found=wordSeeds.filter(w=>lines.includes(w));const src=found.length>=3?found:wordSeeds;const start=hash(today()+target+'teach')%src.length;return [src[start%src.length],src[(start+3)%src.length],src[(start+7)%src.length]].filter((x,i,a)=>a.indexOf(x)===i).slice(0,3)}
function applyAbsence(){const gap=daysBetween(state.lastVisit,today());if(gap>0){addTrait('independent',Math.min(3,gap));if(gap>=2)history(`${gap}日ぶり。勝手に生活していた`);state.lastVisit=today()}if(state.dailyDate!==today()){state.dailyDate=today();state.dailyUsed=0}}
function stageSpeech(stage){const learned=Object.keys(state.learned||{});const word=learned.length?learned.sort((a,b)=>state.learned[b]-state.learned[a])[0]:'';if(stage.key==='egg')return state.totalCare===0?'……中にいる。':state.totalCare===1?'……コト。':'……もうちょい。';if(stage.key==='baby')return word?`${word}……？`:`${viewer==='み'?'みちゃ':'もっち'}……`;if(stage.key==='child')return word?`${word}。おぼえた。`:'きょうなにする？';const d=dominant();const map={affection:'きょうもかまって。',playful:'なんかしよ。',food:'ごはんの気配がする。',routine:'そろそろ生活を整えよう。',weird:word?`${word} ${word}`:'しょもしょも。',independent:'まあ勝手にやっとく。',nostalgia:'むかしのやつ見せて。',night:'まだ寝なくてよくない？'};return map[d]||'いるよ。'}
function actionSpeech(action){const stage=stageFor(),d=dominant(),learned=Object.keys(state.learned||{});if(stage.key==='egg'){return{feed:'中からゴトッとした。',pat:'ちょっとあったかくなった。',play:'たまごが揺れた。',sleep:'静かになった。',poke:'……コツ。',memory:'中で聞いてるっぽい。'}[action]||'……'}if(action==='feed')return d==='food'?'もっと。':'うま。';if(action==='pat')return d==='affection'?'まだやめないで。':'ん。';if(action==='play')return d==='playful'?'もう一回。':'たのし。';if(action==='sleep')return d==='night'?'まだねない。':'すや。';if(action==='poke')return d==='weird'?'なに。しょもしょもするぞ。':'なに。';if(action==='memory')return target==='み'?'これ、わたし？':'これ、ぼく？';if(learned.length&&Math.random()<.5)return learned[Math.floor(Math.random()*learned.length)];return'おけけ。'}
function render(){const s=stageFor(),d=dominant(),remaining=Math.max(0,DAILY_LIMIT-state.dailyUsed);els.petName.textContent=`${names[target]}（育成中）`;els.petSub.textContent=`${names[viewer]}が育ててる、この端末だけの個体`;els.viewerName.textContent=names[viewer];els.targetName.textContent=names[target];els.bornDate.textContent=state.born.replaceAll('-','/');els.careTotal.textContent=`${state.totalCare}回`;els.stageLabel.textContent=s.label;const next=stages[stages.findIndex(x=>x.key===s.key)+1];els.growthText.textContent=next?`${next.label}まで あと${Math.max(0,next.min-state.totalCare)}回`:'おとなになった';els.careLeft.textContent=remaining;els.speech.textContent=state.lastSpeech||stageSpeech(s);els.pet.className=`pet stage-${s.key}`;els.pet.dataset.target=target;els.pet.dataset.vibe=d;if(s.key==='egg')els.pet.classList.add(state.totalCare>=2?'crack-2':state.totalCare>=1?'crack-1':'');els.accessory.textContent=traitMeta[d]?.[1]||'💗';els.careDots.replaceChildren();for(let i=0;i<DAILY_LIMIT;i++){const dot=document.createElement('i');dot.className='care-dot'+(i<state.dailyUsed?' is-used':'');els.careDots.append(dot)}document.querySelectorAll('[data-action]').forEach(b=>b.disabled=remaining<=0);els.traitTags.replaceChildren();const ranked=traits.map(k=>[k,state.traits[k]||0]).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>0).slice(0,s.key==='egg'?1:4);if(!ranked.length){const t=document.createElement('span');t.className='trait-tag';t.textContent='まだ未知';els.traitTags.append(t)}else ranked.forEach(([k,v])=>{const t=document.createElement('span');t.className='trait-tag';t.textContent=(traitMeta[k]?.[1]||'')+' '+(traitMeta[k]?.[0]||k);els.traitTags.append(t)});const learned=Object.keys(state.learned||{}).sort((a,b)=>state.learned[b]-state.learned[a]).slice(0,3);if(learned.length&&s.key!=='egg'){const t=document.createElement('span');t.className='trait-tag';t.textContent='🗣 '+learned.join('・');els.traitTags.append(t)}els.history.replaceChildren();for(const h of(state.history||[]).slice(0,12)){const row=document.createElement('div');row.className='history-row';const time=document.createElement('time'),txt=document.createElement('span');time.textContent=h.at?.replace(/^\d{4}-/,'')||'';txt.textContent=h.text;row.append(time,txt);els.history.append(row)}const q=dailyQuote();els.memoryMail.innerHTML=q?`<small>${esc(fmtDate(q.date))} の${esc(names[target])}</small><p>「${esc(q.text)}」</p>`:'<small>過去ログ</small><p>今日はまだ届いてない。</p>';els.teachPanel.classList.remove('is-show');lastStage=s.key}
async function doCare(action,extra=''){if(state.dailyUsed>=DAILY_LIMIT)return;const before=stageFor().key;state.dailyUsed++;state.totalCare++;const hour=new Date().getHours();if(hour>=23||hour<5)addTrait('night',1);if(action==='feed'){addTrait('food',2);addTrait('affection',.5);history('ごはんをもらった')}if(action==='pat'){addTrait('affection',2);history('なでられた')}if(action==='play'){addTrait('playful',2);history('いっしょに遊んだ')}if(action==='sleep'){addTrait('routine',2);history('寝かされた')}if(action==='poke'){addTrait('weird',1.5);addTrait('playful',.5);history('つつかれた')}if(action==='memory'){addTrait('nostalgia',2);addTrait('affection',.5);const q=dailyQuote();history(q?`${fmtDate(q.date)}の思い出を見せてもらった`:'昔の話を聞いた')}if(action==='teach'){addTrait('weird',2);state.learned[extra]=(state.learned[extra]||0)+1;history(`「${extra}」を覚えた`)}state.lastSpeech=action==='teach'?`${extra}。……${extra}。`:actionSpeech(action);const after=stageFor().key;if(after!==before){state.lastStage=after;history(`${stageFor().label}になった`)}await save();render();if(after!==before)showGrowth(after)}
function showGrowth(stage){const s=stages.find(x=>x.key===stage);els.growthEmoji.textContent={baby:'🐣',child:'🐥',adult:'🐤'}[stage]||'✨';els.growthMessage.textContent=`${names[target]}が「${s?.label||stage}」になった。育て方はもう見た目と性格に出はじめてる。`;els.growthPop.hidden=false}
function showTeach(){if(state.dailyUsed>=DAILY_LIMIT)return;els.teachChoices.replaceChildren();for(const w of teachWords()){const b=document.createElement('button');b.className='teach-word';b.textContent=w;b.onclick=()=>doCare('teach',w);els.teachChoices.append(b)}els.teachPanel.classList.add('is-show')}
function observe(){state.lastSpeech=stageSpeech(stageFor());render()}
async function boot(){viewer=getViewer();target=viewer==='み'?'も':'み';state=await load();state.traits=state.traits||{};traits.forEach(x=>state.traits[x]=Number(state.traits[x]||0));state.learned=state.learned||{};state.history=state.history||[];state.dailyUsed=Number(state.dailyUsed||0);state.totalCare=Number(state.totalCare||0);applyAbsence();state.lastSpeech=stageSpeech(stageFor());await save();render()}
document.getElementById('actionGrid').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='teach')showTeach();else doCare(a)});document.getElementById('observeBtn').onclick=observe;document.getElementById('growthClose').onclick=()=>els.growthPop.hidden=true;els.growthPop.onclick=e=>{if(e.target===els.growthPop)els.growthPop.hidden=true};
document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'warera-grow',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`warera-grow-${viewer}-${target}-${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text()),x=data.state||data;if(!x||!x.born||!x.traits)throw new Error();state=x;state.id=key();state.viewer=viewer;state.target=target;history('バックアップから復元した');await save();render();alert('復元したよ')}catch(err){alert('この育成データは読み込めなかった')}finally{e.target.value=''}};
await boot();let seenViewer=viewer;new MutationObserver(async()=>{const v=getViewer();if(v!==seenViewer){seenViewer=v;await boot()}}).observe(document.body,{childList:true,subtree:true,characterData:true});
})();
</script></body></html>
