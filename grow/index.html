-top:7px;color:#666;font-size:9px;line-height:1.5}.profile-grid{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:10px}.profile-grid dt{color:#777}.profile-grid dd{margin:0;font-weight:700}.history{display:grid;gap:5px;max-height:145px;overflow:auto}.history-row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:7px;padding-bottom:5px;border-bottom:1px solid #eee;font-size:9px;line-height:1.4}.history-row time{color:#777}.data-actions{display:flex;gap:6px;flex-wrap:wrap}.data-actions .press-btn{min-height:31px!important;padding:5px 8px!important;font-size:9px!important}.growth-pop{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:22px;background:rgba(244,244,244,.9)}.growth-pop[hidden]{display:none}.growth-card{width:min(100%,340px);padding:24px;border:2px solid #111;border-radius:12px;background:#fff;text-align:center;box-shadow:5px 5px 0 rgba(0,0,0,.4)}.growth-card .big{font-size:50px}.growth-card h2{margin:8px 0 4px;font-size:24px}.growth-card p{margin:0 0 15px;color:#666;font-size:11px}.growth-card .press-btn{width:100%}

</style></head><body><header class="site-header"><div class="site-header__inner"><a class="brand" href="../">我らのあそび場</a><button class="lock-btn" data-lock>鍵をかける</button></div></header><main class="shell app-shell conversation-shell"><div class="backline"><a href="../">← あそび場にもどる</a></div><section class="app-title"><div class="icon">🥚</div><div><h1>われわれ育成所</h1><p>相手を、勝手に育てる。</p></div></section><div class="grow-shell"><section class="pet-panel"><div class="pet-top"><div class="pet-title"><b id="petName">---</b><span id="petSub">この端末だけの個体</span></div><div class="top-actions"><span class="today-count" id="todayCount">今日 0回</span><button class="press-btn" id="shareBtn">画像にする</button></div></div><div class="needs" id="needs"></div><div class="scene"><span class="scene-state" id="stateLabel">---</span><span class="stage-label" id="stageLabel">たまご</span><div class="pet-wrap"><div class="pet stage-egg" id="pet"><div class="pet-ear left"></div><div class="pet-ear right"></div><div class="pet-body"><div class="egg-mark"><i></i></div><div class="pet-face"><div class="pet-eyes"><span class="pet-eye"></span><span class="pet-eye"></span></div><div class="pet-cheeks"><span class="pet-cheek"></span><span class="pet-cheek"></span></div><div class="pet-mouth"></div></div><div class="pet-belly"></div></div><div class="pet-arms"><span class="pet-arm left"></span><span class="pet-arm right"></span></div><div class="pet-feet"><span class="pet-foot"></span><span class="pet-foot"></span></div><div class="pet-mark" id="petMark"></div><div class="pet-accessory" id="petAccessory">💗</div></div></div></div><div class="speech" id="speech">……<small id="speechNote"></small></div><div class="action-head"><h2>どうする？</h2><span id="actionHint"></span></div><div class="action-grid" id="actionGrid"></div><div class="teach-panel" id="teachPanel"><b>どれを覚えさせる？</b><div class="teach-choices" id="teachChoices"></div></div></section><div class="details"><section class="mini-panel"><h2>この個体のらしさ</h2><div class="trait-groups"><div class="trait-group"><b>本人ログからにじんでる</b><div class="trait-tags" id="innateTags"></div></div><div class="trait-group"><b>あなたの育て方でついた</b><div class="trait-tags" id="traitTags"></div><div class="learned-line" id="learnedLine"></div></div></div></section><section class="mini-panel"><h2>育ち具合</h2><dl class="profile-grid"><dt>育ててる</dt><dd id="viewerName">---</dd><dt>育ってる</dt><dd id="targetName">---</dd><dt>拾った日</dt><dd id="bornDate">---</dd><dt>お世話した</dt><dd id="careTotal">0回</dd><dt>次の成長</dt><dd id="growthText">---</dd></dl></section><section class="mini-panel"><h2>成長記録</h2><div class="history" id="history"></div></section><section class="mini-panel"><h2>育成データ</h2><div class="data-actions"><button class="press-btn" id="exportBtn">バックアップ</button><button class="press-btn" id="importBtn">復元</button><input id="importFile" type="file" accept="application/json" hidden></div></section></div></div></main><div class="growth-pop" id="growthPop" hidden><div class="growth-card"><div class="big" id="growthEmoji">🐣</div><h2>成長した！</h2><p id="growthMessage"></p><button class="press-btn primary" id="growthClose">見にいく</button></div></div><script src="../assets/auth.js"></script><script src="../assets/common.js"></script><script src="../assets/data.js"></script><script>
(async()=>{
wireLock('../');
const KEY_PREFIX='warera_grow_v1_',DB_NAME='warera-grow',STORE='pets';
const names={み:'みちゃこ',も:'もっち'};
const stageDefs=[{key:'egg',label:'たまご',xp:0,days:0},{key:'baby',label:'あかちゃん',xp:70,days:1},{key:'child',label:'こども',xp:230,days:5},{key:'adult',label:'おとな',xp:540,days:14}];
const traits=['affection','playful','food','routine','weird','independent','night'];
const traitMeta={affection:['甘やかされ','💗'],playful:['ちょっかい耐性','🎮'],food:['ごあん好き','🍙'],routine:['オフトゥン民','🛏️'],weird:['われわれ汚染','🌀'],independent:['勝手にやる','🌱'],night:['夜ふかし','🌙']};
const innateDefs=[{key:'affection',label:'かわいい・好き多め',icon:'💗',re:/好き|すき|しゅき|かわい|可愛/g},{key:'sleepy',label:'ねむい族',icon:'💤',re:/眠|ねむ|おやす|オフトゥン/g},{key:'food',label:'ごあん反応型',icon:'🍚',re:/ごはん|ご飯|飯|食べ|たべ|お腹|おなか/g},{key:'laugh',label:'笑いがち',icon:'😂',re:/www|笑|草|わろ|ワロ/g},{key:'weird',label:'われわれ語適性',icon:'🌀',re:/われわれ|しょもしょも|おけけ|オフトゥン|てぇてぇ|はすはす|だん[！!]/g},{key:'call',label:'通話民',icon:'📞',re:/通話|電話|でんわ|声聞/g}];
const wordSeeds=['われわれ','しょもしょも','おけけ','オフトゥン','てぇてぇ','はすはす','ガラスープ','かわいい','好き','ねむい','ごあん','だん！','おやすみ','おはよ'];
const meterMeta={hunger:['ごあん','🍚'],sleep:['オフトゥン','💤'],mood:['ごきげん','✨'],bond:['なつき','💗'],clean:['カラダ','🫧']};
const els={pet:document.getElementById('pet'),petName:document.getElementById('petName'),petSub:document.getElementById('petSub'),stageLabel:document.getElementById('stageLabel'),stateLabel:document.getElementById('stateLabel'),speech:document.getElementById('speech'),speechNote:document.getElementById('speechNote'),accessory:document.getElementById('petAccessory'),mark:document.getElementById('petMark'),needs:document.getElementById('needs'),todayCount:document.getElementById('todayCount'),actionGrid:document.getElementById('actionGrid'),actionHint:document.getElementById('actionHint'),teachPanel:document.getElementById('teachPanel'),teachChoices:document.getElementById('teachChoices'),innateTags:document.getElementById('innateTags'),traitTags:document.getElementById('traitTags'),learnedLine:document.getElementById('learnedLine'),viewerName:document.getElementById('viewerName'),targetName:document.getElementById('targetName'),bornDate:document.getElementById('bornDate'),careTotal:document.getElementById('careTotal'),growthText:document.getElementById('growthText'),history:document.getElementById('history'),growthPop:document.getElementById('growthPop'),growthEmoji:document.getElementById('growthEmoji'),growthMessage:document.getElementById('growthMessage')};
let memories=[];try{memories=await WareraData.memories('../')}catch(e){}let viewer=getViewer(),target=viewer==='み'?'も':'み',state=null,innate=[],quotes=[];
function getViewer(){try{const v=localStorage.getItem('warera_chat_perspective');return v==='も'?'も':'み'}catch(e){return'み'}}
function now(){return Date.now()}function today(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function stamp(){const d=new Date();return`${today()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function daysBetween(a,b){return Math.max(0,Math.floor((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000))}function clamp(v){return Math.max(0,Math.min(100,Number(v)||0))}function key(){return`${KEY_PREFIX}${viewer}_${target}`}
function fresh(){const t={};traits.forEach(x=>t[x]=0);return{id:key(),version:3,viewer,target,born:today(),lastTick:now(),lastVisit:today(),dailyDate:today(),todayActions:0,totalCare:0,growthXP:0,traits:t,needs:{hunger:82,sleep:82,mood:78,bond:72,clean:88},learned:{},history:[{at:stamp(),text:`${names[target]}のたまごを拾った`}],lastSpeech:'……おけけ？',speechSource:'game',lastAction:'',eventSeed:0}}
function openDb(){return new Promise((resolve,reject)=>{try{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}catch(e){reject(e)}})}
async function load(){let x=null;try{const db=await openDb();x=await new Promise((res,rej)=>{const q=db.transaction(STORE,'readonly').objectStore(STORE).get(key());q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)});db.close()}catch(e){}if(!x){try{x=JSON.parse(localStorage.getItem(key())||'null')}catch(e){}}return x||fresh()}
async function save(){state.id=key();state.viewer=viewer;state.target=target;try{localStorage.setItem(key(),JSON.stringify(state))}catch(e){}try{const db=await openDb();await new Promise((res,rej)=>{const q=db.transaction(STORE,'readwrite').objectStore(STORE).put(state);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)});db.close()}catch(e){}}
function migrate(){state.version=Number(state.version||1);state.traits=state.traits||{};traits.forEach(k=>state.traits[k]=Number(state.traits[k]||0));state.learned=state.learned||{};state.history=state.history||[];state.totalCare=Number(state.totalCare||0);state.growthXP=Number(state.growthXP??state.totalCare*5);state.needs=state.needs||{hunger:80,sleep:80,mood:80,bond:75,clean:90};for(const k of Object.keys(meterMeta))state.needs[k]=clamp(state.needs[k]??80);state.lastTick=Number(state.lastTick||now());state.todayActions=state.dailyDate===today()?Number(state.todayActions??state.dailyUsed??0):0;state.dailyDate=today();if(state.version<3){state.version=3;state.lastSpeech='……おけけ？';state.speechSource='game';state.history.unshift({at:stamp(),text:'育成システムがわれわれ仕様になった'})}}
function applyDecay(){const hours=Math.min(72,Math.max(0,(now()-state.lastTick)/3600000));if(hours<.03)return;state.needs.hunger=clamp(state.needs.hunger-hours*4.2);state.needs.sleep=clamp(state.needs.sleep-hours*3.2);state.needs.mood=clamp(state.needs.mood-hours*2.1);state.needs.bond=clamp(state.needs.bond-hours*.8);state.needs.clean=clamp(state.needs.clean-hours*1.5);state.lastTick=now();if(state.dailyDate!==today()){state.dailyDate=today();state.todayActions=0}const gap=daysBetween(state.lastVisit,today());if(gap>=2)state.traits.independent+=Math.min(2,gap*.4);state.lastVisit=today()}
function stageFor(){const age=daysBetween(state.born,today());let s=stageDefs[0];for(const x of stageDefs)if(state.growthXP>=x.xp&&age>=x.days)s=x;return s}function nextStage(){return stageDefs[stageDefs.findIndex(x=>x.key===stageFor().key)+1]||null}
function addHistory(text){state.history.unshift({at:stamp(),text});state.history=state.history.slice(0,120)}function addTrait(k,n=1){state.traits[k]=(state.traits[k]||0)+n}function dominant(){return traits.slice().sort((a,b)=>(state.traits[b]||0)-(state.traits[a]||0))[0]||'affection'}
function buildQuotes(){const out=[];for(const r of memories)for(const l of(r.lines||[])){const text=String(l.text||'').trim();if(l.who===target&&text.length>=2&&text.length<=34&&!text.includes('\n'))out.push({date:r.date,text})}return out}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function buildInnate(){const joined=quotes.map(x=>x.text).join('\n'),arr=[];for(const d of innateDefs){d.re.lastIndex=0;const m=joined.match(d.re);if(m?.length)arr.push({...d,count:m.length})}return arr.sort((a,b)=>b.count-a.count).slice(0,3)}
function signatureWords(){const joined=quotes.map(x=>x.text).join('\n');return wordSeeds.map(w=>({w,count:joined.split(w).length-1})).filter(x=>x.count>0).sort((a,b)=>b.count-a.count).slice(0,7).map(x=>x.w)}
function quote(re,salt=''){const pool=quotes.filter(x=>{re.lastIndex=0;return re.test(x.text)});return pool.length?pool[hash(`${today()}|${target}|${salt}|${state.totalCare}`)%pool.length]:null}
function anyQuote(salt=''){return quotes.length?quotes[hash(`${today()}|${target}|${salt}|${state.totalCare}`)%quotes.length]:null}
function lowestNeed(){return Object.entries(state.needs).sort((a,b)=>a[1]-b[1])[0]}
function currentState(){const s=stageFor();if(s.key==='egg'){if(state.growthXP>=52)return{key:'eggReady',label:'🥚 中でだいぶごそごそしてる',vibe:'playful'};if(state.growthXP>=25)return{key:'eggCrack',label:'🥚 なんかコトコトしてる',vibe:'affection'};return{key:'egg',label:'🥚 たまご、しょもしょも中',vibe:'affection'}}const [k,v]=lowestNeed();if(v<24){const map={hunger:['hungry','🍚 ごあん圧が強い','food'],sleep:['sleepy','💤 オフトゥン圧が強い','sleepy'],mood:['bored','🎲 ひまを持て余してる','independent'],bond:['clingy','💗 かまえ圧が出てる','affection'],clean:['dirty','🫧 カラダ・アラウ待ち','weird']};const x=map[k];return{key:x[0],label:x[1],vibe:x[2]}}if(state.needs.sleep<46)return{key:'sleepy',label:'💤 ねむみが来てる',vibe:'sleepy'};if(state.needs.hunger<46)return{key:'hungry',label:'🍚 ごあんを探してる',vibe:'food'};if(state.needs.clean<45)return{key:'dirty',label:'🫧 そろそろカラダ・アラウ',vibe:'weird'};if(state.needs.bond<48)return{key:'clingy',label:'💗 ちょっとかまってほしい',vibe:'affection'};if(state.needs.mood<48)return{key:'bored',label:'🎲 しょもしょもしたい',vibe:'playful'};const weird=state.traits.weird>8&&hash(today()+target)%3===0;if(weird)return{key:'weird',label:'🌀 語彙がわれわれ寄り',vibe:'weird'};return{key:'fine',label:'おけけ。通常運転',vibe:dominant()}}
function stageDefaultSpeech(){const s=stageFor(),sig=signatureWords();if(s.key==='egg'){if(state.growthXP>=52)return'……だん！ しそう。';if(state.growthXP>=25)return'……おけけ。聞こえてる。';return'……しょもしょも……。'}const cs=currentState();if(cs.key==='hungry')return'ごあん。';if(cs.key==='sleepy')return'オフトゥンの気配。';if(cs.key==='dirty')return'カラダ・アラウ案件。';if(cs.key==='clingy')return viewer==='み'?'みちゃこー':'もっちー';if(cs.key==='bored')return'なんかしょもしょもする？';if(cs.key==='weird')return sig[0]?`${sig[0]}。おけけ。`:'おけけ。';const q=anyQuote('idle');return q?.text||'おけけ。'}
function reaction(action){const actualMap={feed:/ごはん|ご飯|飯|食べ|たべ|お腹|おなか|腹減/,sleep:/眠|ねむ|おやす|オフトゥン/,hug:/好き|すき|しゅき|かわい|可愛/,pat:/好き|すき|かわい|可愛/,wash:/風呂|おふろ|シャワー|カラダ.?アラウ/,chat:/ほんと|まじ|なるほど|ありがとう|おけけ|われわれ/};const q=actualMap[action]?quote(actualMap[action],action):null;if(q&&Math.random()<.65){state.speechSource='log';return q.text}state.speechSource='game';const s=stageFor();if(s.key==='egg'){return{warm:'……ぬく。',call:'……'+(target==='も'?'もっち':'みちゃこ')+'？',tap:'……コト。',listen:state.growthXP>40?'……おけけ。':'……しーん。',log:'……われわれ……？',hum:'……ふんふん。'}[action]||'……'}const map={feed:['ごあん！','おけけ。食べる。','それは食べる。'],snack:['別腹です。','おけけ、おやつ。'],sleep:['オフトゥン！！！！','ねむ。これは寝る。'],pat:['ん。もう一回。','はすはすされてる。'],hug:['ぎゅは許可。','てぇてぇ判定。'],play:['しょもしょもするぞ。','もう一回やる。'],poke:['なに。','つつくなｗ'],wash:['カラダ・アラウしてきます。','アラワレタ。'],chat:['それな。','おけけ。','まじか。'],teach:['覚えた。たぶん。'],log:['われわれ濃度が上がった。','過去ログ浴びた。'],check:['見てるな。']};const arr=map[action]||['おけけ。'];return arr[hash(action+state.totalCare+target)%arr.length]}
function actionSet(){const s=stageFor(),cs=currentState();if(s.key==='egg')return['warm','call','tap','log','hum','listen'];const baseBy={hungry:['feed','snack','chat','pat','check','teach'],sleepy:['sleep','pat','hug','chat','check','log'],dirty:['wash','chat','poke','pat','check','teach'],clingy:['hug','pat','chat','play','check','teach'],bored:['play','poke','chat','teach','check','log'],weird:['teach','log','poke','chat','play','check'],fine:['feed','play','pat','chat','teach','check']};return baseBy[cs.key]||baseBy.fine}
const actionDefs={warm:['🫶','ぬくぬくする'],call:['📣',`${target==='も'?'もっち':'みちゃこ'}って呼ぶ`],tap:['👉','コツコツする'],log:['📼','われわれログを浴びせる'],hum:['🎵','適当に歌う'],listen:['👂','中をうかがう'],feed:['🍚','ごあんをあげる'],snack:['🍪','おやつをあげる'],sleep:['🛏️','オフトゥンへ'],pat:['🫳','なでる'],hug:['🫂','ぎゅする'],play:['🎲','しょもしょもする'],poke:['👉','つつく'],wash:['🫧','カラダ・アラウ'],chat:['💬','しゃべる'],teach:['🗣️','われわれ語を教える'],check:['👀','じっと見る']};
function actionEffects(a){const n=state.needs;if(a==='feed'){n.hunger+=34;n.mood+=5;addTrait('food',1.8)}if(a==='snack'){n.hunger+=18;n.mood+=13;addTrait('food',1)}if(a==='sleep'){n.sleep+=42;n.mood+=4;addTrait('routine',1.8)}if(a==='pat'){n.bond+=23;n.mood+=9;addTrait('affection',1.5)}if(a==='hug'){n.bond+=34;n.mood+=8;addTrait('affection',2)}if(a==='play'){n.mood+=34;n.hunger-=6;n.sleep-=5;addTrait('playful',1.8)}if(a==='poke'){n.mood+=10;n.bond-=2;addTrait('playful',1.2);addTrait('weird',.5)}if(a==='wash'){n.clean+=48;n.mood-=2;addTrait('routine',1)}if(a==='chat'){n.bond+=17;n.mood+=13;addTrait('affection',.6)}if(a==='teach'||a==='log'){n.mood+=10;n.bond+=7;addTrait('weird',1.7)}if(['warm','call','hum'].includes(a)){n.bond+=10;n.mood+=5;addTrait('affection',1)}if(a==='tap'){n.mood+=5;addTrait('playful',1)}for(const k in n)n[k]=clamp(n[k])}
function xpFor(action){const recent=(state.history||[]).slice(0,4).filter(x=>x.action===action).length;return Math.max(1,8-recent*2)}
function renderNeeds(){els.needs.replaceChildren();for(const [k,[label,icon]] of Object.entries(meterMeta)){const v=Math.round(state.needs[k]),d=document.createElement('div');d.className='need';d.innerHTML=`<div class="need-head"><span>${icon} ${label}</span><span>${v}</span></div><div class="meter"><i style="width:${v}%"></i></div>`;els.needs.append(d)}}
function renderActions(){els.actionGrid.replaceChildren();const cs=currentState();for(const [i,k] of actionSet().entries()){const d=actionDefs[k],b=document.createElement('button');b.className='press-btn care-btn'+(i===0?' is-main':'');b.dataset.action=k;b.innerHTML=`<span class="emoji">${d[0]}</span><span class="label">${d[1]}</span>`;els.actionGrid.append(b)}els.actionHint.textContent=stageFor().key==='egg'?'たまご期はたまごにできることだけ':'今の状態で選択肢が変わる'}
function renderTraits(){els.innateTags.replaceChildren();for(const x of innate){const t=document.createElement('span');t.className='trait-tag innate';t.textContent=`${x.icon} ${x.label}`;els.innateTags.append(t)}if(!innate.length){const t=document.createElement('span');t.className='trait-tag innate';t.textContent='まだ解析中';els.innateTags.append(t)}els.traitTags.replaceChildren();const ranked=traits.map(k=>[k,state.traits[k]||0]).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>1).slice(0,4);if(!ranked.length){const t=document.createElement('span');t.className='trait-tag';t.textContent='まだ何色にも染まってない';els.traitTags.append(t)}for(const [k] of ranked){const t=document.createElement('span');t.className='trait-tag';t.textContent=`${traitMeta[k][1]} ${traitMeta[k][0]}`;els.traitTags.append(t)}const learned=Object.keys(state.learned).sort((a,b)=>state.learned[b]-state.learned[a]).slice(0,5);els.learnedLine.textContent=learned.length?`覚えた：${learned.join(' / ')}`:'覚えたことば：まだなし'}
function render(){applyDecay();const s=stageFor(),cs=currentState(),age=daysBetween(state.born,today());els.petName.textContent=`${names[target]}（育成中）`;els.petSub.textContent=`${names[viewer]}が育てたぶんだけ、${names[target]}っぽくも変にもなる`;els.todayCount.textContent=`今日 ${state.todayActions}回`;els.stageLabel.textContent=s.label;els.stateLabel.textContent=cs.label;els.pet.className=`pet stage-${s.key}`;els.pet.dataset.target=target;els.pet.dataset.vibe=cs.vibe||dominant();if(s.key==='egg')els.pet.classList.add(state.growthXP>=50?'crack-2':state.growthXP>=24?'crack-1':'');els.accessory.textContent=traitMeta[dominant()]?.[1]||'💗';els.mark.textContent=innate[0]?.icon||'';els.speech.childNodes[0].nodeValue=state.lastSpeech||stageDefaultSpeech();els.speechNote.textContent=state.speechSource==='log'?'本人ログの言い回しが混ざった':'われわれ育成個体の反応';renderNeeds();renderActions();renderTraits();els.viewerName.textContent=names[viewer];els.targetName.textContent=names[target];els.bornDate.textContent=state.born.replaceAll('-','/');els.careTotal.textContent=`${state.totalCare}回`;const nx=nextStage();if(nx){const dayLeft=Math.max(0,nx.days-age),xpLeft=Math.max(0,nx.xp-state.growthXP);els.growthText.textContent=dayLeft?`最短あと${dayLeft}日（育ち ${Math.round(state.growthXP)}/${nx.xp}）`:`育ち あと${Math.ceil(xpLeft)}くらい`}else els.growthText.textContent='おとな。まだ性格は変わる';els.history.replaceChildren();for(const h of state.history.slice(0,16)){const r=document.createElement('div');r.className='history-row';r.innerHTML=`<time>${esc(String(h.at||'').slice(5))}</time><span>${esc(h.text)}</span>`;els.history.append(r)}els.teachPanel.classList.remove('is-show')}
function teachWords(){const sig=signatureWords(),src=[...new Set([...sig,...wordSeeds])];const start=hash(today()+target+'teach'+state.totalCare)%src.length;return [src[start%src.length],src[(start+2)%src.length],src[(start+5)%src.length]].filter((x,i,a)=>a.indexOf(x)===i).slice(0,3)}
function showTeach(){els.teachChoices.replaceChildren();for(const w of teachWords()){const b=document.createElement('button');b.className='teach-word';b.textContent=w;b.onclick=()=>care('teach',w);els.teachChoices.append(b)}els.teachPanel.classList.add('is-show')}
async function care(action,extra=''){if(action==='teach'&&!extra){showTeach();return}const before=stageFor().key;state.todayActions++;state.totalCare++;state.growthXP+=xpFor(action);actionEffects(action);if(action==='teach'&&extra){state.learned[extra]=(state.learned[extra]||0)+1;state.lastSpeech=`${extra}。……${extra}。`;state.speechSource='game'}else state.lastSpeech=reaction(action);state.lastAction=action;const label=action==='teach'?`「${extra}」を覚えさせた`:actionDefs[action]?.[1]||action;state.history.unshift({at:stamp(),text:label,action});state.history=state.history.slice(0,120);const after=stageFor().key;if(after!==before){state.history.unshift({at:stamp(),text:`${stageFor().label}になった`,action:'growth'});showGrowth(after)}await save();render()}
function showGrowth(stage){const s=stageDefs.find(x=>x.key===stage);els.growthEmoji.textContent={baby:'🐣',child:'🐥',adult:'✨'}[stage]||'✨';els.growthMessage.textContent=`${names[target]}が「${s?.label||stage}」になった。ここからさらに育て方が顔と口ぐせに出る。`;els.growthPop.hidden=false}
function drawRound(ctx,x,y,w,h,r){const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath()}
function drawPet(ctx,cx,cy,scale=1){const s=stageFor(),pink=target==='み',body=pink?'#fff0f5':'#eaf6ff',deep=pink?'#f8dce7':'#cfe9fb',blush=pink?'#ffc6d8':'#ffd9e4';ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);ctx.strokeStyle='#111';ctx.lineWidth=3;if(s.key==='egg'){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,0,85,108,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=deep;ctx.globalAlpha=.65;ctx.beginPath();ctx.ellipse(18,20,56,76,.2,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;if(state.growthXP>=24){ctx.beginPath();ctx.moveTo(-38,-12);ctx.lineTo(-5,9);ctx.lineTo(14,-2);ctx.lineTo(40,21);ctx.stroke()}ctx.restore();return}ctx.fillStyle=deep;ctx.beginPath();ctx.ellipse(-52,-72,33,43,-.35,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(52,-72,33,43,.35,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,0,92,86,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.ellipse(0,31,38,29,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';for(const ex of[-33,33]){ctx.beginPath();ctx.ellipse(ex,-20,7,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex-2,-23,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111'}ctx.fillStyle=blush;for(const ex of[-55,55]){ctx.beginPath();ctx.ellipse(ex,0,13,6,0,0,Math.PI*2);ctx.fill()}ctx.beginPath();ctx.arc(0,4,12,0,Math.PI);ctx.stroke();ctx.fillStyle=deep;for(const ex of[-50,50]){ctx.beginPath();ctx.ellipse(ex,76,23,11,0,0,Math.PI*2);ctx.fill();ctx.stroke()}ctx.font='28px sans-serif';ctx.fillText(traitMeta[dominant()]?.[1]||'💗',67,-46);ctx.restore()}
async function sharePet(){const W=1080,H=1350,canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d'),cs=currentState();ctx.fillStyle='#f4f4f4';ctx.fillRect(0,0,W,H);ctx.fillStyle='#111';ctx.font='800 54px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText('われわれ育成所',70,92);ctx.font='700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText(`${names[viewer]}が育ててる ${names[target]}`,70,145);ctx.fillStyle='#777';ctx.font='24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText(`${today().replaceAll('-','/')} / ${stageFor().label} / お世話 ${state.totalCare}回`,70,188);ctx.fillStyle='#fff';drawRound(ctx,70,230,940,620,28);ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#111';ctx.font='700 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText(cs.label,105,290);drawPet(ctx,540,520,1.55);ctx.fillStyle='#fafafa';drawRound(ctx,115,730,850,82,18);ctx.fill();ctx.strokeStyle='#999';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#111';ctx.font='700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.textAlign='center';ctx.fillText(state.lastSpeech||stageDefaultSpeech(),540,780);ctx.textAlign='left';ctx.fillStyle='#fff';drawRound(ctx,70,890,940,370,28);ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#111';ctx.font='800 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText('この個体のらしさ',105,945);ctx.fillStyle='#555';ctx.font='22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText('本人ログから',105,995);ctx.fillStyle='#111';ctx.font='700 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText(innate.slice(0,3).map(x=>`${x.icon} ${x.label}`).join('   ')||'まだ解析中',105,1037);ctx.fillStyle='#555';ctx.font='22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText(`${names[viewer]}の育て方から`,105,1090);ctx.fillStyle='#111';ctx.font='700 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';const ranked=traits.map(k=>[k,state.traits[k]||0]).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>1).slice(0,3).map(([k])=>`${traitMeta[k][1]} ${traitMeta[k][0]}`).join('   ')||'まだ未知';ctx.fillText(ranked,105,1132);ctx.fillStyle='#777';ctx.font='21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText(`ごあん ${Math.round(state.needs.hunger)} / オフトゥン ${Math.round(state.needs.sleep)} / ごきげん ${Math.round(state.needs.mood)} / なつき ${Math.round(state.needs.bond)} / カラダ ${Math.round(state.needs.clean)}`,105,1186);const learned=Object.keys(state.learned).sort((a,b)=>state.learned[b]-state.learned[a]).slice(0,4);ctx.fillText(`覚えたことば：${learned.length?learned.join(' / '):'まだなし'}`,105,1226);const blob=await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error('画像を作れなかった')),'image/png')),file=new File([blob],`warera-grow-${target}-${today()}.png`,{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e?.name==='AbortError')return}}if(navigator.clipboard&&window.ClipboardItem){try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);alert('画像をコピーしたよ');return}catch(e){}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function boot(){viewer=getViewer();target=viewer==='み'?'も':'み';state=await load();migrate();applyDecay();quotes=buildQuotes();innate=buildInnate();if(!state.lastSpeech)state.lastSpeech=stageDefaultSpeech();await save();render()}
els.actionGrid.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)care(b.dataset.action)});document.getElementById('shareBtn').onclick=async e=>{const b=e.currentTarget;b.disabled=true;try{await sharePet()}finally{b.disabled=false}};document.getElementById('growthClose').onclick=()=>els.growthPop.hidden=true;els.growthPop.onclick=e=>{if(e.target===els.growthPop)els.growthPop.hidden=true};document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'warera-grow',version:3,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`warera-grow-${viewer}-${target}-${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text()),x=d.state||d;if(!x?.born||!x?.traits)throw 0;state=x;migrate();addHistory('バックアップから復元した');await save();render();alert('復元したよ')}catch(err){alert('この育成データは読み込めなかった')}finally{e.target.value=''}};
await boot();let seenViewer=viewer;new MutationObserver(async()=>{const v=getViewer();if(v!==seenViewer){seenViewer=v;await boot()}}).observe(document.body,{childList:true,subtree:true,characterData:true});setInterval(()=>{applyDecay();renderNeeds();const cs=currentState();els.stateLabel.textContent=cs.label},60000);
})();
