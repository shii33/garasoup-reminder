function stageFor(){const age=daysBetween(state.born,today());let s=stageDefs[0];for(const x of stageDefs)if(state.totalCare>=x.minCare&&age>=x.minDays)s=x;return s}
function stageIndex(s=stageFor()){return stageDefs.findIndex(x=>x.key===s.key)}
function nextStage(){return stageDefs[stageIndex()+1]||null}
function dominant(){return traits.slice().sort((a,b)=>(state.traits[b]||0)-(state.traits[a]||0))[0]||'affection'}
function addTrait(k,n=1){state.traits[k]=(state.traits[k]||0)+n}
function addHistory(text){state.history.unshift({at:stamp(),text});state.history=state.history.slice(0,100)}
function partnerQuotes(){const out=[];for(const r of memories){for(const l of(r.lines||[])){const text=String(l.text||'').trim();if(l.who===target&&text.length>=2&&text.length<=70)out.push({date:r.date,text})}}return out}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function dailyQuote(){const q=partnerQuotes();return q.length?q[hash(today()+target)%q.length]:null}
function buildInnate(){const joined=partnerQuotes().map(x=>x.text).join('\n'),arr=[];for(const d of innateDefs){d.re.lastIndex=0;const hits=joined.match(d.re);arr.push({...d,count:hits?hits.length:0})}return arr.sort((a,b)=>b.count-a.count).filter(x=>x.count>0).slice(0,3)}
function signatureWords(){const joined=partnerQuotes().map(x=>x.text).join('\n');return wordSeeds.map(w=>({w,count:joined.split(w).length-1})).filter(x=>x.count>0).sort((a,b)=>b.count-a.count).slice(0,5).map(x=>x.w)}
function teachWords(){const sig=signatureWords(),src=[...new Set([...sig,...wordSeeds])];const start=hash(today()+target+'teach')%src.length;return [src[start%src.length],src[(start+3)%src.length],src[(start+7)%src.length]].filter((x,i,a)=>a.indexOf(x)===i).slice(0,3)}
function quoteFor(re){const rows=partnerQuotes().filter(x=>re.test(x.text));if(!rows.length)return null;return rows[hash(today()+target+String(re))%rows.length]}
function applyAbsence(){const gap=daysBetween(state.lastVisit,today());if(gap>0){addTrait('independent',Math.min(2.5,gap*.5));if(gap>=2)addHistory(`${gap}日ぶり。勝手に元気にしていた`);state.lastVisit=today()}if(state.dailyDate!==today()){state.dailyDate=today();state.dailyUsed=0;state.condition=pickMorningCondition()}}
function pickMorningCondition(){const h=new Date().getHours();if(h<7||h>=23)return'sleepy';const choices=h<11?['hungry','calm','curious']:h<18?['bored','curious','hungry','calm']:['clingy','bored','nostalgic','calm'];return choices[hash(today()+target+'condition')%choices.length]}
function innateVibe(){const k=innate[0]?.key;return k==='sleepy'?'sleepy':k==='food'?'food':k==='weird'?'weird':k==='affection'?'affection':k==='laugh'?'playful':'affection'}
function stageSpeech(s){const learned=Object.keys(state.learned||{});const word=learned.sort((a,b)=>(state.learned[b]||0)-(state.learned[a]||0))[0]||'';if(s.key==='egg'){if(state.totalCare<4)return'……中にいる。';if(state.totalCare<8)return'……コト。';return'……なんか、もうすぐ。'}if(s.key==='baby')return word?`${word}……？`:`${viewer==='み'?'みちゃ':'もっち'}……`;if(s.key==='child')return word?`${word}。おぼえた。`:'きょうなにする？';const c=state.condition;if(c==='hungry')return'ごはんの気配がする。';if(c==='sleepy')return'ねむい。オフトゥン。';if(c==='clingy')return'なんか、かまって。';if(c==='nostalgic')return'むかしのやつ見たい。';if(dominant()==='weird'&&word)return`${word} ${word}`;return'いるよ。'}
function actionSet(){const s=stageFor();if(s.key==='egg')return['warm','talkEgg','rock','storyEgg','callName','listen'];const c=state.condition;const map={hungry:['feed','snack','pat','chat','play','observe'],sleepy:['sleep','lullaby','pat','chat','memory','observe'],clingy:['hug','pat','chat','memory','play','observe'],bored:['play','teach','poke','memory','chat','observe'],curious:['teach','memory','chat','play','poke','observe'],nostalgic:['memory','hug','chat','teach','pat','observe'],hyper:['play','poke','chat','snack','teach','observe'],calm:['feed','pat','play','sleep','teach','memory']};return map[c]||map.calm}
function nextCondition(action){const h=new Date().getHours();if(action==='feed'||action==='snack')return h>=23?'sleepy':['calm','playful'].includes(dominant())?'hyper':'calm';if(action==='sleep'||action==='lullaby')return'calm';if(action==='play'||action==='poke'||action==='rock')return Math.random()<.55?'hungry':'hyper';if(action==='pat'||action==='hug'||action==='warm')return Math.random()<.5?'clingy':'calm';if(action==='teach'||action==='talkEgg'||action==='callName')return'curious';if(action==='memory'||action==='storyEgg')return'nostalgic';if(action==='chat')return Math.random()<.5?'clingy':'bored';return state.condition||'calm'}
function actionSpeech(action){const s=stageFor();if(s.key==='egg'){return{warm:'あったかい。……たぶん。',talkEgg:'……聞こえてる。',rock:'ゆら……ゆら……。',storyEgg:'中で静かに聞いてる。',callName:`……${names[target]}？`,listen:state.totalCare>=8?'……コツ、コツ。':'……しーん。'}[action]||'……'}const exact=action==='sleep'?quoteFor(/ねむ|眠|オフトゥン/):action==='feed'?quoteFor(/ごはん|ご飯|食べ|お腹|おなか/):action==='hug'||action==='pat'?quoteFor(/好き|すき|かわい|可愛/):null;if(exact&&Math.random()<.35)return exact.text;if(action==='feed')return dominant()==='food'?'もっと。':'うま。';if(action==='snack')return'それ別腹。';if(action==='pat')return dominant()==='affection'?'まだやめないで。':'ん。';if(action==='hug')return'……ぎゅ。';if(action==='play')return dominant()==='playful'?'もう一回。':'たのし。';if(action==='sleep')return dominant()==='night'?'まだねない。':'オフトゥン。';if(action==='lullaby')return'すや……。';if(action==='poke')return dominant()==='weird'?'なに。しょもしょもするぞ。':'なに。';if(action==='memory')return target==='み'?'これ、わたし？':'これ、ぼく？';if(action==='chat')return'もっとはなして。';return stageSpeech(s)}
function markForInnate(){const k=innate[0]?.key;return({affection:'♥',sleepy:'☾',food:'•',laugh:'✦',weird:'ぐ',call:'♪',work:'▣'})[k]||''}
function renderActions(){els.actionGrid.replaceChildren();const remaining=Math.max(0,DAILY_LIMIT-state.dailyUsed),s=stageFor();for(const key of actionSet()){const d=actionDefs[key],b=document.createElement('button');b.className='press-btn care-btn';b.dataset.action=key;b.innerHTML=`<span class="emoji">${d.icon}</span><span class="label">${d.label}</span>`;if(!d.free&&remaining<=0)b.disabled=true;els.actionGrid.append(b)}els.actionNote.textContent=s.key==='egg'?'たまごのうちは、できることもたまご仕様。耳をすますのは何回でもできます。':'いまの様子に合わせて、できることが変わります。「いま何してる？」は何回でも。'}
function render(){const s=stageFor(),d=dominant(),remaining=Math.max(0,DAILY_LIMIT-state.dailyUsed),age=daysBetween(state.born,today());els.petName.textContent=`${names[target]}（育成中）`;els.petSub.textContent=`${names[viewer]}が育ててる、この端末だけの個体`;els.viewerName.textContent=names[viewer];els.targetName.textContent=names[target];els.bornDate.textContent=state.born.replaceAll('-','/');els.careTotal.textContent=`${state.totalCare}回`;els.stageLabel.textContent=s.label;const next=nextStage();if(next){const careLeft=Math.max(0,next.minCare-state.totalCare),dayLeft=Math.max(0,next.minDays-age);els.growthText.textContent=dayLeft?`${next.label}まで 最短あと${dayLeft}日`:`${next.label}まで あと${careLeft}回くらい`}else els.growthText.textContent='おとなになった';els.careLeft.textContent=remaining;els.speech.textContent=state.lastSpeech||stageSpeech(s);const cm=conditionMeta[s.key==='egg'?'egg':state.condition]||conditionMeta.calm;els.conditionPill.textContent=`${cm[0]} いま：${cm[1]}`;els.pet.className=`pet stage-${s.key}`;els.pet.dataset.target=target;els.pet.dataset.vibe=s.key==='egg'?'affection':d||innateVibe();if(s.key==='egg')els.pet.classList.add(state.totalCare>=8?'crack-2':state.totalCare>=4?'crack-1':'');els.accessory.textContent=traitMeta[d]?.[1]||'💗';els.mark.textContent=markForInnate();els.careDots.replaceChildren();for(let i=0;i<DAILY_LIMIT;i++){const dot=document.createElement('i');dot.className='care-dot'+(i<state.dailyUsed?' is-used':'');els.careDots.append(dot)}els.innateTags.replaceChildren();for(const x of innate){const t=document.createElement('span');t.className='trait-tag innate';t.textContent=`${x.icon} ${x.label}`;els.innateTags.append(t)}if(!innate.length){const t=document.createElement('span');t.className='trait-tag innate';t.textContent='まだ解析中';els.innateTags.append(t)}els.traitTags.replaceChildren();const ranked=traits.map(k=>[k,state.traits[k]||0]).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>0).slice(0,s.key==='egg'?2:4);if(!ranked.length){const t=document.createElement('span');t.className='trait-tag';t.textContent='まだ未知';els.traitTags.append(t)}for(const [k] of ranked){const t=document.createElement('span');t.className='trait-tag';t.textContent=`${traitMeta[k][1]} ${traitMeta[k][0]}`;els.traitTags.append(t)}const learned=Object.keys(state.learned||{}).sort((a,b)=>state.learned[b]-state.learned[a]).slice(0,5);els.learnedLine.textContent=learned.length?`覚えたことば：${learned.join(' / ')}`:'覚えたことば：まだなし';const q=dailyQuote();els.memoryMail.innerHTML=q?`<small>${esc(fmtDate(q.date))} の${esc(names[target])}</small><p>「${esc(q.text)}」</p>`:'<small>---</small><p>まだ何も届いてない。</p>';els.history.replaceChildren();for(const h of state.history.slice(0,15)){const r=document.createElement('div');r.className='history-row';r.innerHTML=`<time>${esc(String(h.at||'').slice(5))}</time><span>${esc(h.text)}</span>`;els.history.append(r)}renderActions();els.teachPanel.classList.remove('is-show')}
function traitForAction(action){const hour=new Date().getHours();if(hour>=23||hour<5)addTrait('night',.7);if(['warm','pat','hug','talkEgg','callName'].includes(action))addTrait('affection',1.5);if(['play','poke','rock'].includes(action))addTrait('playful',1.6);if(['feed','snack'].includes(action))addTrait('food',1.8);if(['sleep','lullaby'].includes(action))addTrait('routine',1.8);if(['memory','storyEgg'].includes(action))addTrait('nostalgia',1.8);if(['teach'].includes(action))addTrait('weird',2)}
function historyText(action,extra=''){return{warm:'たまごをあたためた',talkEgg:'たまごに声をかけた',rock:'たまごをそっとゆらした',storyEgg:'たまごに昔話をした',callName:`「${names[target]}」と呼びかけた`,feed:'ごはんをあげた',snack:'おやつをあげた',pat:'なでなでした',hug:'ぎゅっとした',play:'いっしょに遊んだ',poke:'ちょっかいを出した',sleep:'オフトゥンに入れた',lullaby:'寝かしつけた',chat:'いっぱい話した',memory:'昔のわれわれを見せた',teach:`「${extra}」を教えた`}[action]||'様子を見た'}
async function doCare(action,extra=''){const def=actionDefs[action]||{};if(def.free){state.lastSpeech=action==='listen'?actionSpeech('listen'):stageSpeech(stageFor());render();return}if(state.dailyUsed>=DAILY_LIMIT)return;const before=stageFor().key;state.dailyUsed++;state.totalCare++;traitForAction(action);if(action==='teach'&&extra){state.learned[extra]=(state.learned[extra]||0)+1;state.lastSpeech=`${extra}。……${extra}。`}else state.lastSpeech=actionSpeech(action);addHistory(historyText(action,extra));state.lastAction=action;state.condition=nextCondition(action);const after=stageFor().key;if(after!==before){state.stageSeen=after;addHistory(`${stageFor().label}になった`)}await save();render();if(after!==before)showGrowth(after)}
function showGrowth(stage){const s=stageDefs.find(x=>x.key===stage);els.growthEmoji.textContent={baby:'🐣',child:'🐥',adult:'✨'}[stage]||'✨';els.growthMessage.textContent=`${names[target]}が「${s?.label||stage}」になった。本人っぽさと、${names[viewer]}の育て方が少しずつ混ざってきた。`;els.growthPop.hidden=false}
function showTeach(){if(state.dailyUsed>=DAILY_LIMIT)return;els.teachChoices.replaceChildren();for(const w of teachWords()){const b=document.createElement('button');b.className='teach-word';b.textContent=w;b.onclick=()=>doCare('teach',w);els.teachChoices.append(b)}els.teachPanel.classList.add('is-show')}
function actionClick(action){if(action==='teach')showTeach();else doCare(action)}
function drawRound(ctx,x,y,w,h,r){const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath()}
function drawPet(ctx,cx,cy,scale=1){const s=stageFor(),pink=target==='み',body=pink?'#fff0f5':'#eaf6ff',deep=pink?'#f8dce7':'#cfe9fb',blush=pink?'#ffc6d8':'#ffd9e4';ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);ctx.strokeStyle='#111';ctx.lineWidth=3;if(s.key==='egg'){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,0,85,108,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=deep;ctx.globalAlpha=.65;ctx.beginPath();ctx.ellipse(18,20,56,76,.2,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;if(state.totalCare>=4){ctx.beginPath();ctx.moveTo(-38,-12);ctx.lineTo(-5,9);ctx.lineTo(14,-2);ctx.lineTo(40,21);ctx.stroke()}ctx.restore();return}ctx.fillStyle=deep;ctx.beginPath();ctx.ellipse(-52,-72,33,43,-.35,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(52,-72,33,43,.35,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,0,92,86,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.ellipse(0,31,38,29,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';for(const ex of[-33,33]){ctx.beginPath();ctx.ellipse(ex,-20,7,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex-2,-23,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111'}ctx.fillStyle=blush;ctx.beginPath();ctx.ellipse(-55,0,13,6,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(55,0,13,6,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(0,4,12,0,Math.PI);ctx.stroke();ctx.fillStyle=deep;ctx.beginPath();ctx.ellipse(-50,76,23,11,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(50,76,23,11,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.font='28px sans-serif';ctx.fillText(traitMeta[dominant()]?.[1]||'💗',67,-46);ctx.restore()}
async function sharePet(){const W=1080,H=1350,canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');ctx.fillStyle='#f4f4f4';ctx.fillRect(0,0,W,H);ctx.fillStyle='#111';ctx.font='800 54px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText('われわれ育成所',70,92);ctx.font='700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText(`${names[viewer]}が育ててる ${names[target]}`,70,145);ctx.fillStyle='#777';ctx.font='24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText(`${today().replaceAll('-','/')}  /  ${stageFor().label}  /  お世話 ${state.totalCare}回`,70,188);ctx.fillStyle='#fff';drawRound(ctx,70,230,940,640,28);ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.stroke();const cm=conditionMeta[stageFor().key==='egg'?'egg':state.condition]||conditionMeta.calm;ctx.fillStyle='#111';ctx.font='700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText(`${cm[0]} ${cm[1]}`,105,285);drawPet(ctx,540,535,1.55);ctx.fillStyle='#fafafa';drawRound(ctx,110,755,860,78,18);ctx.fill();ctx.strokeStyle='#999';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#111';ctx.font='700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.textAlign='center';ctx.fillText(state.lastSpeech||stageSpeech(stageFor()),540,804);ctx.textAlign='left';ctx.fillStyle='#fff';drawRound(ctx,70,910,940,350,28);ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#111';ctx.font='800 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText('この個体のらしさ',105,965);ctx.font='700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillStyle='#555';ctx.fillText('本人から受け継いだもの',105,1013);ctx.fillStyle='#111';const inn=innate.slice(0,3).map(x=>`${x.icon} ${x.label}`).join('   ')||'まだ解析中';ctx.fillText(inn,105,1054);ctx.fillStyle='#555';ctx.fillText(`${names[viewer]}の育て方でついたもの`,105,1110);ctx.fillStyle='#111';const ranked=traits.map(k=>[k,state.traits[k]||0]).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>0).slice(0,3).map(([k])=>`${traitMeta[k][1]} ${traitMeta[k][0]}`).join('   ')||'まだ未知';ctx.fillText(ranked,105,1152);const learned=Object.keys(state.learned||{}).sort((a,b)=>state.learned[b]-state.learned[a]).slice(0,4);ctx.fillStyle='#777';ctx.font='22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText(`覚えたことば：${learned.length?learned.join(' / '):'まだなし'}`,105,1205);const blob=await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error('画像を作れなかった')),'image/png'));const file=new File([blob],`warera-grow-${target}-${today()}.png`,{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e?.name==='AbortError')return}}if(navigator.clipboard&&window.ClipboardItem){try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);alert('画像をコピーしたよ');return}catch(e){}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function boot(){viewer=getViewer();target=viewer==='み'?'も':'み';state=await load();migrate();applyAbsence();innate=buildInnate();if(stageFor().key==='egg')state.condition='egg';if(!state.lastSpeech)state.lastSpeech=stageSpeech(stageFor());await save();render()}
els.actionGrid.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)actionClick(b.dataset.action)});document.getElementById('shareBtn').onclick=async e=>{const b=e.currentTarget;b.disabled=true;try{await sharePet()}finally{b.disabled=false}};document.getElementById('growthClose').onclick=()=>els.growthPop.hidden=true;els.growthPop.onclick=e=>{if(e.target===els.growthPop)els.growthPop.hidden=true};
document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'warera-grow',version:2,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`warera-grow-${viewer}-${target}-${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text()),x=data.state||data;if(!x||!x.born||!x.traits)throw new Error();state=x;state.id=key();state.viewer=viewer;state.target=target;migrate();addHistory('バックアップから復元した');await save();render();alert('復元したよ')}catch(err){alert('この育成データは読み込めなかった')}finally{e.target.value=''}};
await boot();let seenViewer=viewer;new MutationObserver(async()=>{const v=getViewer();if(v!==seenViewer){seenViewer=v;await boot()}}).observe(document.body,{childList:true,subtree:true,characterData:true});
