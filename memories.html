<!DOCTYPE html>
<html lang="ja" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <meta http-equiv="Content-Language" content="ja" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#f4f0e8" />
  <title>こんなこともあったね</title>
  <style>
    :root {
      --bg:#f4f0e8; --paper:#fffdf8; --ink:#272624; --muted:#8a847c;
      --line:#e6dfd4; --mine:#e9e2d7; --theirs:#292826; --theirs-ink:#fffdf8;
      --shadow:0 18px 50px rgba(45,39,31,.08);
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","YuGothic","Noto Sans JP",sans-serif}
    .wrap{width:min(100%,480px)}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:28px 22px 22px;box-shadow:var(--shadow)}
    .eyebrow{margin:0 0 6px;color:var(--muted);font-size:12px;letter-spacing:.12em}
    h1{margin:0;font-size:clamp(25px,7vw,34px);line-height:1.25;letter-spacing:-.03em}
    .date{margin-top:10px;color:var(--muted);font-size:13px}
    .scene{display:flex;flex-direction:column;gap:10px;margin:30px 0 28px;min-height:190px}
    .line{display:flex;align-items:flex-end;gap:8px}.line.mine{justify-content:flex-end}.line.theirs{justify-content:flex-start}
    .who{flex:0 0 25px;width:25px;height:25px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;color:var(--muted);font-size:10px;background:#fff}
    .bubble{max-width:82%;padding:11px 14px;border-radius:17px;font-size:14px;line-height:1.7;overflow-wrap:anywhere;white-space:pre-wrap}
    .mine .bubble{background:var(--mine);border-bottom-right-radius:5px}.theirs .bubble{background:var(--theirs);color:var(--theirs-ink);border-bottom-left-radius:5px}
    .actions{display:grid;gap:9px}button,input{font:inherit}
    .primary{width:100%;border:0;border-radius:15px;padding:14px 18px;background:var(--ink);color:#fff;font-weight:650;cursor:pointer}
    .primary:active{transform:translateY(1px)}.primary:disabled{opacity:.45;cursor:default}
    .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:13px;color:var(--muted);font-size:11px}
    .linkish{appearance:none;border:0;padding:0;background:none;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
    .login{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:rgba(244,240,232,.97);backdrop-filter:blur(8px)}
    .login[hidden]{display:none}.login-box{width:min(100%,360px);text-align:center}.login-box .bird{font-size:38px;margin-bottom:12px}.login-box h2{margin:0 0 8px;font-size:24px}.login-box p{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.7}
    .login-box input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:var(--paper);color:var(--ink);outline:none;text-align:center}.login-box input:focus{border-color:#aaa39a}.login-box .primary{margin-top:10px}
    .remember{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:12px;color:var(--muted);font-size:12px}.remember input{width:auto;padding:0;margin:0}
    .error{min-height:18px;margin-top:10px;color:#a44848;font-size:12px}.loading .scene{opacity:.35}
    @media(prefers-reduced-motion:no-preference){.card{animation:appear .35s ease both}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}}
  </style>
</head>
<body>
  <main class="wrap" id="app">
    <section class="card">
      <p class="eyebrow">たまに思い出すやつ</p>
      <h1>こんなこともあったね</h1>
      <div class="date" id="date">&nbsp;</div>
      <div class="scene" id="scene" aria-live="polite"></div>
      <div class="actions"><button class="primary" id="nextButton" type="button">もういっこ</button></div>
      <div class="meta"><span id="count"></span><button class="linkish" id="forgetCode" type="button">あいことばを忘れる</button></div>
    </section>
  </main>

  <div class="login" id="login">
    <div class="login-box">
      <div class="bird">🐔</div>
      <h2>あいことば</h2>
      <p>ここだけのやつなので、最初だけ。</p>
      <input id="codeInput" type="password" autocomplete="current-password" enterkeyhint="go" />
      <label class="remember"><input id="rememberCode" type="checkbox" checked /> この端末では覚えておく</label>
      <button class="primary" id="loginButton" type="button">ひらく</button>
      <div class="error" id="loginError"></div>
    </div>
  </div>

<script>
  const ENC_URL = "./memories.enc";
  const STORAGE_KEY = "memory_site_passphrase";
  const RECENT_KEY = "memory_site_recent";

  const app=document.getElementById("app"), scene=document.getElementById("scene"), dateEl=document.getElementById("date"), countEl=document.getElementById("count"), nextButton=document.getElementById("nextButton"), login=document.getElementById("login"), codeInput=document.getElementById("codeInput"), rememberCode=document.getElementById("rememberCode"), loginButton=document.getElementById("loginButton"), loginError=document.getElementById("loginError"), forgetCode=document.getElementById("forgetCode");
  let memories=[];

  const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  function setLoading(on){app.classList.toggle("loading",on);nextButton.disabled=on;loginButton.disabled=on}

  async function deriveKey(passphrase,salt,iterations){
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(passphrase),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  }

  async function decryptMemories(passphrase){
    const res=await fetch(ENC_URL,{cache:"no-store"});
    if(!res.ok) throw new Error("思い出ファイルを読み込めませんでした");
    const pack=await res.json();
    const key=await deriveKey(passphrase,fromB64(pack.salt),pack.iterations);
    let plain;
    try{plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(pack.iv)},key,fromB64(pack.ciphertext))}
    catch(e){throw new Error("あいことば、ちがうかも")}
    const data=JSON.parse(new TextDecoder().decode(plain));
    if(!Array.isArray(data.memories)||!data.memories.length) throw new Error("思い出が空っぽでした");
    return data.memories;
  }

  function renderMemory(memory){
    dateEl.textContent=String(memory.date||"").replaceAll("-",".");
    countEl.textContent=`${memories.length}個のどこかから`;
    scene.replaceChildren();
    (memory.lines||[]).forEach(item=>{
      const row=document.createElement("div"), mine=item.who==="み";
      row.className=`line ${mine?"mine":"theirs"}`;
      const who=document.createElement("span"); who.className="who"; who.textContent=item.who;
      const bubble=document.createElement("div"); bubble.className="bubble"; bubble.textContent=item.text;
      mine?row.append(bubble,who):row.append(who,bubble); scene.append(row);
    });
  }

  function pickRandom(){
    if(!memories.length)return;
    let recent=[]; try{recent=JSON.parse(localStorage.getItem(RECENT_KEY)||"[]")}catch(e){}
    const recentSet=new Set(recent);
    let candidates=memories.filter(m=>!recentSet.has(m.id));
    if(!candidates.length){recent=[];candidates=[...memories]}
    const memory=candidates[Math.floor(Math.random()*candidates.length)];
    recent.push(memory.id); if(recent.length>30) recent=recent.slice(-30);
    localStorage.setItem(RECENT_KEY,JSON.stringify(recent));
    renderMemory(memory);
  }

  async function unlock(passphrase,fromLogin=false){
    setLoading(true); loginError.textContent="";
    try{
      memories=await decryptMemories(passphrase);
      if(rememberCode.checked) localStorage.setItem(STORAGE_KEY,passphrase); else localStorage.removeItem(STORAGE_KEY);
      login.hidden=true; pickRandom();
    }catch(err){
      localStorage.removeItem(STORAGE_KEY); login.hidden=false; loginError.textContent=err.message||"ひらけませんでした";
      if(fromLogin) codeInput.select();
    }finally{setLoading(false)}
  }

  loginButton.addEventListener("click",()=>{const p=codeInput.value;if(!p){loginError.textContent="あいことばを入れてね";return}unlock(p,true)});
  codeInput.addEventListener("keydown",e=>{if(e.key==="Enter")loginButton.click()});
  nextButton.addEventListener("click",pickRandom);
  forgetCode.addEventListener("click",()=>{localStorage.removeItem(STORAGE_KEY);memories=[];codeInput.value="";loginError.textContent="";login.hidden=false;codeInput.focus()});

  const saved=localStorage.getItem(STORAGE_KEY)||"";
  if(saved){codeInput.value=saved;login.hidden=true;unlock(saved)} else {login.hidden=false;setTimeout(()=>codeInput.focus(),50)}
</script>
</body>
</html>
