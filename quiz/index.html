<!DOCTYPE html><html lang="ja" class="notranslate" translate="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><meta name="robots" content="noindex,nofollow,noarchive"><title>われわれ検定｜我らのあそび場</title><link rel="stylesheet" href="../assets/site.css"><style>.quiz-panel{margin-top:8px}.quiz-modes{margin-bottom:10px}.quiz-modes-label{display:none}.quiz-tabs{gap:7px}.quiz-tab{min-height:46px;padding:7px 10px}.quiz-tab b{font-size:12px}.quiz-tab span{font-size:9px;margin-top:1px}.progress-wrap{margin:9px 0 0}.progress-meta{margin-bottom:5px}.progress-track{height:8px}.quiz-question-label{color:#666;font-size:11px}.quiz-question-text{font-size:20px;font-weight:800;line-height:1.55;margin-top:5px}.quiz-prompt-text{font-size:19px;font-weight:800;line-height:1.5;color:#111}.quiz-next-label{font-size:11px;font-weight:700;color:#666;margin-top:5px}.quiz-choices{margin-top:9px;display:grid;gap:7px}.quiz-choices.who-mode{grid-template-columns:1fr 1fr}.quiz-choice{width:100%;height:auto!important;min-height:44px;padding:9px 11px!important;text-align:left;font-size:14px;line-height:1.45;white-space:normal!important;overflow-wrap:anywhere;word-break:break-word;margin:0!important}.quiz-choices.who-mode .quiz-choice{text-align:center;font-weight:800}.quiz-result-wrap{min-height:0;margin-top:9px}.quiz-result-card{border:1px solid #111;border-radius:10px;padding:12px;background:#fff;box-shadow:2px 2px 0 rgba(0,0,0,.35)}.quiz-result-main{display:flex;gap:10px;align-items:center}.quiz-mark{width:38px;height:38px;display:grid;place-items:center;font-size:34px;font-weight:900;line-height:1}.quiz-mark.ok{color:#d34848}.quiz-mark.ng{color:#3276c8}.quiz-result-title{font-size:18px;font-weight:800}.quiz-result-answer{margin-top:2px;font-size:12px;line-height:1.5}.quiz-context{margin-top:10px;padding-top:10px;border-top:1px solid #ddd}.quiz-context[hidden]{display:none}.quiz-context .chat-scene{margin-bottom:8px}.quiz-result-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}.quiz-result-actions .press-btn{height:auto;min-height:38px;padding:8px 9px;white-space:normal;font-size:11px}.quiz-result-actions #nextNow{grid-column:1/-1}.finish-comment{font-size:17px;font-weight:800;margin:5px 0 12px}.finish-score-big{font-size:27px;font-weight:800}.finish{margin-top:10px}@media(max-width:580px){input,textarea,select{font-size:16px!important}.quiz-panel{margin-top:5px}.quiz-tabs{grid-template-columns:repeat(2,minmax(0,1fr))!important}.quiz-tab{min-height:42px;padding:6px 7px!important}.quiz-tab b{font-size:11px}.quiz-tab span{font-size:8.5px}.quiz-question-text{font-size:18px;line-height:1.45}.quiz-prompt-text{font-size:17px;line-height:1.45}.quiz-choice{font-size:13px;min-height:40px}.quiz-result-card{padding:10px}.quiz-result-actions{gap:6px}}</style></head><body><header class="site-header"><div class="site-header__inner"><a class="brand" href="../">我らのあそび場</a><button class="lock-btn" data-lock>鍵をかける</button></div></header><main class="shell app-shell"><div class="backline"><a href="../">← あそび場にもどる</a></div><section class="app-title"><div class="icon">❓</div><div><h1>われわれ検定</h1></div></section><section class="panel quiz-panel"><div class="quiz-modes"><div class="quiz-tabs"><button class="filter quiz-tab is-active" id="modeWho"><b>発言者あて</b><span>これ言ったのどっち？</span></button><button class="filter quiz-tab" id="modeNext"><b>続きあて</b><span>この次なんて返した？</span></button></div></div><div class="progress-wrap"><div class="progress-meta"><span id="progressText">1 / 10</span><span id="score">正解 0</span></div><div class="progress-track"><i id="progressBar"></i></div></div><div id="question" style="margin-top:11px"></div><div id="choices" class="quiz-choices"></div><div id="result" class="quiz-result-wrap"></div><div id="finish" class="finish" hidden><div class="finish-score-big" id="finishScore"></div><div class="finish-comment" id="finishComment"></div><button class="press-btn primary" id="restart">もう10問</button></div></section></main><script src="../assets/auth.js"></script><script src="../assets/common.js"></script><script src="../assets/data.js"></script><script>
(async()=>{wireLock('../');const [d,memories,quizScenePack]=await Promise.all([WareraData.expandedQuiz('../'),WareraData.memories('../'),WareraData.quizScenePack('../')]),whoB=document.getElementById('modeWho'),nextB=document.getElementById('modeNext'),question=document.getElementById('question'),choices=document.getElementById('choices'),result=document.getElementById('result'),scoreEl=document.getElementById('score'),progressText=document.getElementById('progressText'),progressBar=document.getElementById('progressBar'),finish=document.getElementById('finish'),finishScore=document.getElementById('finishScore'),finishComment=document.getElementById('finishComment'),restart=document.getElementById('restart');const GOAL=10,HISTORY_KEY='warera_quiz_recent_v2',HISTORY_LIMIT=160;let mode='who',score=0,n=0,current=null,answered=false,deck=[];
const comments={10:['本人か？','全問正解。こわ。','記憶力が当事者。','10問とも分かるの、もうログ側の人。'],9:['惜しい。ほぼ本人。','1問だけ世界線が違った。','9/10、かなりわれわれ。'],8:['かなりわれわれ。','ちゃんと覚えてるやん。','8割われわれ。十分濃い。'],7:['まあまあわれわれ。','いい線いってる。','ちゃんとわれわれ。'],6:['半分超えた。えらい。','記憶、まだある。','6割われわれ。'],5:['ちょうど半分。','五分五分われわれ。','記憶と勘が半々。'],4:['記憶、ちょい迷子。','4割。まだ帰ってこれる。','うっすらわれわれ。'],3:['記憶、どこ置いてきた。','3割われわれ。','ログに聞いた方が早そう。'],2:['だいぶ初対面。','2問は知ってた。えらい。','思い出そうず案件。'],1:['1問だけ魂が覚えてた。','ほぼ初対面。','その1問を大事にしよう。'],0:['初対面？','全滅wwww','われわれとは。','記憶、きれいさっぱり。']};
function resultComment(s){const a=comments[s]||comments[0];return a[Math.floor(Math.random()*a.length)]}function source(){return mode==='who'?d.who:d.next}function qkey(x){return mode==='who'?`who|${x.date||''}|${x.quote||''}`:`next|${x.date||''}|${x.prompt||''}|${x.answer||''}`}function loadRecent(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch(e){return[]}}function remember(x){const key=qkey(x);let r=loadRecent().filter(v=>v!==key);r.push(key);try{localStorage.setItem(HISTORY_KEY,JSON.stringify(r.slice(-HISTORY_LIMIT)))}catch(e){}}function refill(){const all=[...source()],recent=new Set(loadRecent()),fresh=all.filter(x=>!recent.has(qkey(x)));deck=fresh.length>=GOAL?fresh:all;for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}function updateProgress(){progressText.textContent=`${Math.min(n+1,GOAL)} / ${GOAL}`;scoreEl.textContent=`正解 ${score}`;progressBar.style.width=`${Math.min(n,GOAL)/GOAL*100}%`}function drawScene(target,item){target.replaceChildren();(item?.lines||[]).forEach(x=>{const row=document.createElement('div'),w=document.createElement('span'),b=document.createElement('div');row.className='chat-line '+(x.who==='み'?'mine':'theirs');w.className='who';w.textContent=x.who;b.className='bubble';b.textContent=x.text;x.who==='み'?row.append(b,w):row.append(w,b);target.append(row)})}
function choose(){if(n>=GOAL){showFinish();return}if(!deck.length)refill();current=deck.pop();remember(current);answered=false;result.innerHTML='';finish.hidden=true;question.hidden=false;choices.hidden=false;updateProgress();choices.classList.toggle('who-mode',mode==='who');if(mode==='who'){question.innerHTML=`<div class="quiz-question-label">この発言、どっち？</div><div class="quiz-question-text">「${esc(current.quote).replaceAll('\n','<br>')}」</div>`;choices.innerHTML=['み','も'].map(x=>`<button class="press-btn quiz-choice" data-v="${x}">${x}</button>`).join('')}else{question.innerHTML=`<div class="quiz-prompt-text">${current.prompt_who}「${esc(current.prompt).replaceAll('\n','<br>')}」</div><div class="quiz-next-label">この次は？</div>`;choices.innerHTML=current.options.map((x,i)=>`<button class="press-btn quiz-choice" data-v="${i}">${esc(x).replaceAll('\n','<br>')}</button>`).join('')}choices.querySelectorAll('button').forEach(b=>b.onclick=()=>answer(b))}
function answer(b){if(answered)return;answered=true;choices.querySelectorAll('button').forEach(x=>x.disabled=true);const ok=mode==='who'?b.dataset.v===current.answer:current.options[Number(b.dataset.v)]===current.answer;if(ok){score++;b.classList.add('correct')}else{b.classList.add('wrong');choices.querySelectorAll('button').forEach(x=>{const value=mode==='who'?x.dataset.v:current.options[Number(x.dataset.v)];if(value===current.answer)x.classList.add('correct')})}n++;progressBar.style.width=`${n/GOAL*100}%`;scoreEl.textContent=`正解 ${score}`;const found=WareraData.findSceneForQuiz(memories,current,quizScenePack),mark=ok?'○':'×',markClass=ok?'ok':'ng',answerText=ok?fmtDate(current.date):`正解は「${esc(current.answer)}」・${fmtDate(current.date)}`;result.innerHTML=`<div class="quiz-result-card"><div class="quiz-result-main"><div class="quiz-mark ${markClass}">${mark}</div><div><div class="quiz-result-title">${ok?'正解！':'不正解'}</div><div class="quiz-result-answer">${answerText}</div></div></div><div class="quiz-result-actions"><button class="press-btn primary" id="nextNow">${n>=GOAL?'結果を見る':'次へ'}</button>${found?`<button class="press-btn" id="showContext">前後を見る</button><a class="press-btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="../on-this-day/?date=${encodeURIComponent(found.date)}&scene=${encodeURIComponent(found.id)}&source=quiz">この日を見る</a>`:''}</div><div class="quiz-context" id="contextBox" hidden>${found?'<div class="chat-scene" id="contextScene"></div>':''}</div></div>`;document.getElementById('nextNow').onclick=()=>n>=GOAL?showFinish():choose();const show=document.getElementById('showContext');if(show&&found)show.onclick=()=>{const box=document.getElementById('contextBox');box.hidden=false;drawScene(document.getElementById('contextScene'),found);show.hidden=true}}
function showFinish(){question.hidden=true;choices.hidden=true;result.innerHTML='';finish.hidden=false;finishScore.textContent=`${score} / ${GOAL} 正解`;finishComment.textContent=resultComment(score);progressText.textContent=`${GOAL} / ${GOAL}`;progressBar.style.width='100%'}function reset(nextMode=mode){mode=nextMode;score=0;n=0;deck=[];refill();whoB.classList.toggle('is-active',mode==='who');nextB.classList.toggle('is-active',mode==='next');choose()}whoB.onclick=()=>reset('who');nextB.onclick=()=>reset('next');restart.onclick=()=>reset(mode);reset('who')})();
</script></body></html>
