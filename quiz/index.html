<!DOCTYPE html><html lang="ja" class="notranslate" translate="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><meta name="robots" content="noindex,nofollow,noarchive"><title>われわれ検定｜我らのあそび場</title><link rel="stylesheet" href="../assets/site.css"><style>.quiz-question-label{color:#666;font-size:13px}.quiz-question-text{font-size:23px;font-weight:800;line-height:1.7;margin-top:8px}.quiz-prompt-text{font-size:21px;font-weight:800;line-height:1.65;color:#111}.quiz-next-label{font-size:13px;font-weight:700;color:#666;margin-top:10px}.quiz-choice{width:100%;height:auto!important;min-height:50px;padding:12px 14px!important;text-align:left;font-size:15px;line-height:1.55;white-space:normal;overflow-wrap:anywhere;word-break:break-word}.quiz-result-card{border:1px solid #111;border-radius:10px;padding:16px;background:#fff;box-shadow:2px 2px 0 rgba(0,0,0,.35)}.quiz-result-main{display:flex;gap:12px;align-items:center}.quiz-mark{width:48px;height:48px;display:grid;place-items:center;font-size:42px;font-weight:900;line-height:1}.quiz-mark.ok{color:#d34848}.quiz-mark.ng{color:#3276c8}.quiz-result-title{font-size:22px;font-weight:800}.quiz-result-answer{margin-top:4px;font-size:14px;line-height:1.6}.quiz-context{margin-top:14px;padding-top:14px;border-top:1px solid #ddd}.quiz-context[hidden]{display:none}.quiz-context .chat-scene{margin-bottom:12px}.quiz-result-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.quiz-result-actions .press-btn{height:auto;min-height:40px;padding:9px 12px;white-space:normal}.finish-comment{font-size:20px;font-weight:800;margin:7px 0 16px}.finish-score-big{font-size:32px;font-weight:800}@media(max-width:580px){input,textarea,select{font-size:16px!important}.quiz-question-text{font-size:22px}.quiz-prompt-text{font-size:20px}.quiz-choice{font-size:16px}}</style></head><body><header class="site-header"><div class="site-header__inner"><a class="brand" href="../">我らのあそび場</a><button class="lock-btn" data-lock>鍵をかける</button></div></header><main class="shell app-shell"><div class="backline"><a href="../">← あそび場にもどる</a></div><section class="app-title"><div class="icon">❓</div><div><h1>われわれ検定</h1><p>10問で、われわれ力を測る。</p></div></section><div style="height:24px"></div><section class="panel"><div class="quiz-modes"><div class="quiz-modes-label">問題タイプを選ぶ</div><div class="quiz-tabs"><button class="filter quiz-tab is-active" id="modeWho"><b>発言者あて</b><span>「これ言ったのどっち？」</span></button><button class="filter quiz-tab" id="modeNext"><b>続きあて</b><span>「この次、なんて返した？」</span></button></div></div><div class="progress-wrap"><div class="progress-meta"><span id="progressText">1 / 10</span><span id="score">正解 0</span></div><div class="progress-track"><i id="progressBar"></i></div></div><div id="question" style="margin-top:22px"></div><div id="choices" style="margin-top:14px"></div><div id="result" style="min-height:44px;margin-top:14px"></div><div id="finish" hidden style="margin-top:18px"><div class="finish-score-big" id="finishScore"></div><div class="finish-comment" id="finishComment"></div><button class="press-btn primary" id="restart">もう10問</button></div></section></main><script src="../assets/auth.js"></script><script src="../assets/common.js"></script><script src="../assets/data.js"></script><script>
(async()=>{
  wireLock('../');

  const [core,memories] = await Promise.all([WareraData.core('../'),WareraData.memories('../')]);
  const d = core.quiz;
  const whoB = document.getElementById('modeWho');
  const nextB = document.getElementById('modeNext');
  const question = document.getElementById('question');
  const choices = document.getElementById('choices');
  const result = document.getElementById('result');
  const scoreEl = document.getElementById('score');
  const progressText = document.getElementById('progressText');
  const progressBar = document.getElementById('progressBar');
  const finish = document.getElementById('finish');
  const finishScore = document.getElementById('finishScore');
  const finishComment = document.getElementById('finishComment');
  const restart = document.getElementById('restart');

  const GOAL = 10;
  let mode = 'who';
  let score = 0;
  let n = 0;
  let current = null;
  let answered = false;
  let deck = [];

  function source(){return mode === 'who' ? d.who : d.next;}
  function refill(){
    deck=[...source()];
    for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  }
  function updateProgress(){
    progressText.textContent=`${Math.min(n+1,GOAL)} / ${GOAL}`;
    scoreEl.textContent=`正解 ${score}`;
    progressBar.style.width=`${Math.min(n,GOAL)/GOAL*100}%`;
  }
  function drawScene(target,item){
    target.replaceChildren();
    (item?.lines||[]).forEach(x=>{const row=document.createElement('div');row.className='chat-line '+(x.who==='み'?'mine':'theirs');const w=document.createElement('span');w.className='who';w.textContent=x.who;const b=document.createElement('div');b.className='bubble';b.textContent=x.text;x.who==='み'?row.append(b,w):row.append(w,b);target.append(row)});
  }
  function resultComment(s){
    if(s===10)return '本人か？';
    if(s>=8)return 'かなりわれわれ';
    if(s>=5)return 'まあまあわれわれ';
    if(s>=2)return '記憶、どこ置いてきた';
    return '初対面？';
  }

  function choose(){
    if(n>=GOAL){showFinish();return;}
    if(!deck.length)refill();
    current=deck.pop();answered=false;result.innerHTML='';finish.hidden=true;question.hidden=false;choices.hidden=false;updateProgress();
    if(mode==='who'){
      question.innerHTML=`<div class="quiz-question-label">この発言、どっち？</div><div class="quiz-question-text">「${esc(current.quote).replaceAll('\n','<br>')}」</div>`;
      choices.innerHTML=['み','も'].map(x=>`<button class="press-btn quiz-choice" data-v="${x}">${x}</button>`).join('');
    }else{
      question.innerHTML=`<div class="quiz-prompt-text">${current.prompt_who}「${esc(current.prompt).replaceAll('\n','<br>')}」</div><div class="quiz-next-label">この次は？</div>`;
      choices.innerHTML=current.options.map((x,i)=>`<button class="press-btn quiz-choice" data-v="${i}">${esc(x).replaceAll('\n','<br>')}</button>`).join('');
    }
    [...choices.querySelectorAll('button')].forEach(b=>b.onclick=()=>answer(b));
  }

  function answer(b){
    if(answered)return;answered=true;
    [...choices.querySelectorAll('button')].forEach(x=>x.disabled=true);
    const ok=mode==='who'?b.dataset.v===current.answer:current.options[Number(b.dataset.v)]===current.answer;
    if(ok){score++;b.classList.add('correct')}else{
      b.classList.add('wrong');
      [...choices.querySelectorAll('button')].forEach(x=>{const value=mode==='who'?x.dataset.v:current.options[Number(x.dataset.v)];if(value===current.answer)x.classList.add('correct')});
    }
    n++;progressBar.style.width=`${n/GOAL*100}%`;scoreEl.textContent=`正解 ${score}`;

    const found=WareraData.findSceneForQuiz(memories,current);
    const mark=ok?'○':'×',markClass=ok?'ok':'ng',titleText=ok?'正解！':'不正解';
    const answerText=ok?fmtDate(current.date):`正解は「${esc(current.answer)}」・${fmtDate(current.date)}`;
    const contextControls=found
      ? `<button class="press-btn" id="showContext">この前後の会話を見る</button><a class="press-btn" id="openDay" style="display:inline-flex;align-items:center;text-decoration:none" href="../on-this-day/?date=${encodeURIComponent(found.date)}&scene=${encodeURIComponent(found.id)}&around=1">あの日のわれわれで周辺を見る</a>`
      : '';
    result.innerHTML=`<div class="quiz-result-card"><div class="quiz-result-main"><div class="quiz-mark ${markClass}">${mark}</div><div><div class="quiz-result-title">${titleText}</div><div class="quiz-result-answer">${answerText}</div></div></div><div class="quiz-result-actions">${contextControls}<button class="press-btn primary" id="nextNow">${n>=GOAL?'結果を見る':'次の問題へ'}</button></div><div class="quiz-context" id="contextBox" hidden>${found?'<div class="chat-scene" id="contextScene"></div>':''}</div></div>`;
    document.getElementById('nextNow').onclick=()=>n>=GOAL?showFinish():choose();
    const show=document.getElementById('showContext');
    if(show&&found){show.onclick=()=>{const box=document.getElementById('contextBox');box.hidden=false;drawScene(document.getElementById('contextScene'),found);show.hidden=true;}};
  }

  function showFinish(){
    question.hidden=true;choices.hidden=true;result.innerHTML='';finish.hidden=false;
    finishScore.textContent=`${score} / ${GOAL} 正解`;finishComment.textContent=resultComment(score);progressText.textContent=`${GOAL} / ${GOAL}`;progressBar.style.width='100%';
  }
  function reset(nextMode=mode){
    mode=nextMode;score=0;n=0;deck=[];refill();
    whoB.classList.toggle('is-active',mode==='who');nextB.classList.toggle('is-active',mode==='next');choose();
  }
  whoB.onclick=()=>reset('who');nextB.onclick=()=>reset('next');restart.onclick=()=>reset(mode);reset('who');
})();
</script></body></html>
