<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>我らのあそび場</title></head><body><script>(async()=>{const p=['assets/site/sitez-01.part','assets/site/sitez-02.part','assets/site/sitez-03.part','assets/site/sitez-04.part','assets/site/sitez-05.part','assets/site/sitez-06.part'];try{const r=await Promise.all(p.map(x=>fetch(x,{cache:'no-store'})));if(r.some(x=>!x.ok))throw 0;const b=(await Promise.all(r.map(x=>x.text()))).join('');const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()}catch(e){document.body.textContent='読み込みに失敗しました'}})()</script></body></html>
