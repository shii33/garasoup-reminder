<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta http-equiv="Content-Language" content="ja">
  <meta name="google" content="notranslate">

  <meta name="theme-color" content="#f7f3ea" />

  <title>ガラスープ忘れ防止装置</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f3ea;
      color: #242424;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
    }

    .card {
      width: min(100%, 420px);
      padding: 42px 28px 30px;
      background: #fff;
      border: 1px solid #e7e1d7;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.06);
    }

    .icon {
      font-size: 48px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.4;
      letter-spacing: 0.02em;
    }

    .sub {
      margin: 12px 0 30px;
      color: #777;
      font-size: 14px;
      line-height: 1.8;
    }

    .buttons {
      display: grid;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 15px 18px;
      border-radius: 14px;
      border: 0;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .yes {
      background: #242424;
      color: #fff;
    }

    .not-yet {
      background: #f0ede7;
      color: #333;
    }

    .message {
      min-height: 54px;
      margin-top: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      line-height: 1.7;
      white-space: pre-line;
    }

    .tiny {
      margin-top: 24px;
      color: #aaa;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="icon">🐔</div>

    <h1>ガラスープ、思い出せそ？</h1>

    <p class="sub">
      今回こそ<br />
      ガラスープのターン！
    </p>

    <div class="buttons">
      <button class="yes" id="yes">買えた！</button>
      <button class="not-yet" id="notYet">まだだった</button>
    </div>

    <div class="message" id="message"></div>

    <div class="tiny">ガラスープ忘れ防止装置</div>
  </main>

  <script>
    const message = document.getElementById("message");

    const successMessages = [
      "やった〜！\nガラスープがついに家に来る",
      "思い出せた！えらい 🐔",
      "ガラスープ確保◎",
      "これで安心して中華ができます"
    ];

    const reminderMessages = [
      "そっか〜\n次の買い物で思い出せたら◎",
      "まだチャンスはあります 🐔",
      "次にスーパーへ行ったとき\nふと思い出せますように",
      "ガラスープは今日も\n静かに待っています"
    ];

    function randomMessage(messages) {
      return messages[Math.floor(Math.random() * messages.length)];
    }

    document.getElementById("yes").addEventListener("click", () => {
      message.textContent = randomMessage(successMessages);
    });

    document.getElementById("notYet").addEventListener("click", () => {
      message.textContent = randomMessage(reminderMessages);
    });
  </script>
</body>
</html>
