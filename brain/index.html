<!DOCTYPE html><html lang="ja" class="notranslate" translate="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><meta name="robots" content="noindex,nofollow,noarchive"><title>われわれ脳内メーカー｜我らのあそび場</title><link rel="stylesheet" href="../assets/site.css"><style>
.brain-tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin:4px 0 14px}.date-btn{position:relative;display:flex!important;align-items:center;justify-content:flex-start;overflow:hidden;cursor:pointer}.date-btn span{pointer-events:none}.date-btn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;pointer-events:none}.brain-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.brain-side{min-width:0;text-align:center}.brain-who{display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:8px;font-size:12px;font-weight:800}.brain-who img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid #111}.head{position:relative;width:100%;aspect-ratio:1/1.05;min-height:250px;border:2px solid #111;border-radius:48% 48% 42% 42% / 38% 38% 55% 55%;background:#fff;overflow:hidden;box-shadow:4px 4px 0 rgba(0,0,0,.36)}.head:after{content:'';position:absolute;right:-2px;bottom:11%;width:17%;height:24%;background:#f5f5f5;border-left:2px solid #111;border-radius:70% 0 0 70%;z-index:1}.brain-word{position:absolute;z-index:2;display:block;max-width:44%;font-weight:900;line-height:1.05;word-break:keep-all;white-space:nowrap;transform:translate(-50%,-50%)}.brain-word:nth-child(1){left:50%;top:26%}.brain-word:nth-child(2){left:30%;top:45%}.brain-word:nth-child(3){left:68%;top:48%}.brain-word:nth-child(4){left:46%;top:65%}.brain-word:nth-child(5){left:25%;top:69%}.brain-word:nth-child(6){left:70%;top:72%}.brain-word:nth-child(7){left:48%;top:82%}.breakdown{display:grid;gap:5px;margin-top:10px;text-align:left}.break-row{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:7px;align-items:center;font-size:10px}.break-row span:first-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.break-row b{text-align:right}.brain-summary{margin:16px 0 0;padding:11px 12px;border:1px dashed #999;border-radius:9px;background:#fafafa;font-size:11px;line-height:1.65}.empty-brain{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#888;font-size:11px;z-index:2}.source-note{margin-top:10px;color:#888;font-size:9px;line-height:1.5;text-align:center}
@media(max-width:580px){.brain-tools{grid-template-columns:minmax(0,1fr) 82px;gap:7px}.brain-pair{gap:8px}.head{min-height:0;aspect-ratio:1/1.15;box-shadow:3px 3px 0 rgba(0,0,0,.36)}.brain-who{font-size:10px;gap:5px}.brain-who img{width:24px;height:24px}.brain-word{max-width:48%}.breakdown{gap:3px;margin-top:7px}.break-row{grid-template-columns:minmax(0,1fr) 34px;font-size:8px;gap:4px}.brain-summary{margin-top:12px;font-size:10px;padding:9px 10px}.source-note{font-size:8px}}
</style></head><body><header class="site-header"><div class="site-header__inner"><a class="brand" href="../">我らのあそび場</a><button class="lock-btn" data-lock>鍵をかける</button></div></header><main class="shell app-shell conversation-shell"><div class="backline"><a href="../">← あそび場にもどる</a></div><section class="app-title"><div class="icon">🧠</div><div><h1>われわれ脳内メーカー</h1><p>その日、何で頭がいっぱいだったか。</p></div><span class="source-count" id="sourceCount"></span></section><div class="brain-tools"><label class="press-btn date-btn" id="dateBtn" role="button" tabindex="0"><span id="dateLabel">日付を選ぶ</span><input id="dateInput" type="date" tabindex="-1" aria-label="日付を選ぶ"></label><button class="press-btn" id="randomBtn">ランダム</button></div><section class="brain-pair"><div class="brain-side"><div class="brain-who"><img src="../assets/avatars/mi.jpg" alt=""><span>みの脳内</span></div><div class="head" id="miHead"></div><div class="breakdown" id="miBreak"></div></div><div class="brain-side"><div class="brain-who"><img src="../assets/avatars/mo.jpg" alt=""><span>もの脳内</span></div><div class="head" id="moHead"></div><div class="breakdown" id="moBreak"></div></div></section><div class="brain-summary" id="summary"></div><p class="source-note">占有率は、その日の保存ログに出てきたテーマ語をもとにした遊びの集計です。</p></main><script src="../assets/auth.js"></script><script src="../assets/common.js"></script><script src="../assets/data.js"></script><script>
(async()=>{
wireLock('../');
const rows=await WareraData.memories('../');
const dateInput=document.getElementById('dateInput'),dateLabel=document.getElementById('dateLabel'),dateBtn=document.getElementById('dateBtn'),randomBtn=document.getElementById('randomBtn'),miHead=document.getElementById('miHead'),moHead=document.getElementById('moHead'),miBreak=document.getElementById('miBreak'),moBreak=document.getElementById('moBreak'),summary=document.getElementById('summary');
const themes=[
['かわいい',/かわい|可愛/g],['好き',/好き|すき|しゅき|大好き|だいすき/g],['会いたい',/会いた|あいたい|会いて/g],['眠い',/眠|ねむ|寝たい|おやす/g],['仕事',/仕事|会社|会議|案件|残業|業務|出勤|退勤/g],['ごはん',/ごはん|ご飯|飯|食べ|たべ|お腹|おなか|腹減|ガラスープ/g],['風呂',/風呂|おふろ|シャワー|カラダ.?アラウ/g],['通話',/通話|電話|でんわ|声聞|話したい/g],['疲れ',/疲|つかれ|しんど|だる|限界/g],['うれしい',/嬉|うれし|やった|最高|よかった|よかた/g],['かなしい',/悲|かなしい|泣|つら|へこ/g],['しょもしょも',/しょもしょも/g],['おけけ',/おけけ|おけおけおけけ/g],['オフトゥン',/オフトゥン/g],['ちっち',/ちっち/g],['てぇてぇ',/てぇてぇ/g],['はすはす',/はすはす/g],['だん！',/だん[！!]/g],['われわれ',/われわれ/g],['ぱっちくん',/ぱっちくん/g]
];
const grouped=new Map();for(const r of rows){if(!grouped.has(r.date))grouped.set(r.date,{み:[],も:[]});for(const l of (r.lines||[])){if(l.who==='み'||l.who==='も')grouped.get(r.date)[l.who].push(String(l.text||''))}}
const dates=[...grouped.keys()].sort();dateInput.min=dates[0]||'';dateInput.max=dates.at(-1)||'';document.getElementById('sourceCount').textContent=dates.length?`${dates.length}日分から`:'保存ログから';
function countThemes(lines){const joined=lines.join('\n'),out=[];for(const [label,re] of themes){re.lastIndex=0;const hits=joined.match(re);const count=hits?hits.length:0;if(count)out.push({label,count})}out.sort((a,b)=>b.count-a.count||a.label.localeCompare(b.label,'ja'));const top=out.slice(0,7),total=top.reduce((s,x)=>s+x.count,0);return top.map(x=>({...x,pct:total?Math.round(x.count/total*100):0}))}
function sizeFor(item,max){const ratio=max?item.count/max:0;return Math.round(10+ratio*16)}
function paint(head,box,data){head.replaceChildren();box.replaceChildren();if(!data.length){const e=document.createElement('div');e.className='empty-brain';e.textContent='今日は静か';head.append(e);return}const max=data[0].count;data.forEach((x,i)=>{const w=document.createElement('span');w.className='brain-word';w.textContent=x.label;w.style.fontSize=sizeFor(x,max)+'px';w.style.opacity=String(Math.max(.55,1-i*.07));head.append(w);const row=document.createElement('div');row.className='break-row';row.innerHTML=`<span>${esc(x.label)}</span><b>${x.pct}%</b>`;box.append(row)})}
function setDate(d){if(!grouped.has(d))return;dateInput.value=d;dateLabel.textContent=d.replaceAll('-','/');const data=grouped.get(d),mi=countThemes(data.み),mo=countThemes(data.も);paint(miHead,miBreak,mi);paint(moHead,moBreak,mo);const a=mi[0]?.label||'静か',b=mo[0]?.label||'静か';summary.textContent=a===b?`今日のわれわれ脳：ふたりとも「${a}」が強め。`:`今日のわれわれ脳：みは「${a}」、もは「${b}」が強め。`;const u=new URL(location.href);u.searchParams.set('date',d);history.replaceState(null,'',u)}
function openPicker(){if(typeof dateInput.showPicker==='function'){try{dateInput.showPicker();return}catch(e){}}dateInput.focus();dateInput.click()}
dateBtn.addEventListener('click',e=>{e.preventDefault();openPicker()});dateBtn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPicker()}});dateInput.addEventListener('change',()=>setDate(dateInput.value));randomBtn.onclick=()=>setDate(dates[Math.floor(Math.random()*dates.length)]);
const pd=new URLSearchParams(location.search).get('date');setDate(pd&&grouped.has(pd)?pd:dates[Math.floor(Math.random()*dates.length)]);
})();
</script></body></html>
