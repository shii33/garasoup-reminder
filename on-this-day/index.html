<!DOCTYPE html><html lang="ja" class="notranslate" translate="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><meta name="robots" content="noindex,nofollow,noarchive"><title>あの日のわれわれ｜我らのあそび場</title><link rel="stylesheet" href="../assets/site.css"><style>.day-tools,.calendar-controls,.log-search{width:100%;min-width:0;max-width:100%}.day-tools{display:grid;gap:8px;margin:6px 0 8px;overflow:visible}.calendar-controls{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:7px}.calendar-controls>*{min-width:0;max-width:100%}.calendar-controls input{display:block;width:100%;min-width:0;max-width:100%}.calendar-controls #anniversaryBtn{grid-column:1/-1}.log-search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px}.log-search>*{min-width:0;max-width:100%}.log-search input{display:block;width:100%;min-width:0;height:40px;border:1px solid #111;border-radius:10px;padding:0 11px;background:#fff;box-shadow:2px 2px 0 rgba(0,0,0,.45)}.search-note{min-height:16px;color:#666;font-size:10px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid #e1e1e1}.card-head b{font-size:12px;letter-spacing:.04em;color:#555}.card-head span{font-size:10px;color:#777}.anniversary-note{display:none;margin:8px 0;padding:9px 11px;border:1px dashed #999;border-radius:9px;background:#fafafa;font-size:11px;font-weight:700;line-height:1.6}.anniversary-note.is-show{display:block}.anniversary-date{display:inline-block;margin-left:7px;color:#666}.scene-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}.scene-nav .primary-action{grid-column:1/-1}.scene-nav .press-btn{width:100%;text-align:center}.around-wrap{display:grid;gap:10px}.around-block{padding:10px;border:1px solid #ddd;border-radius:9px;background:#fafafa}.around-block.is-current{border-color:#111;background:#fff}.around-label{font-size:10px;font-weight:800;color:#777;margin-bottom:8px}.around-block.is-current .around-label{color:#111}@media(max-width:580px){.day-tools,.calendar-controls,.log-search,.conversation-card,.scene-nav{width:100%;max-width:100%}.calendar-controls{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.calendar-controls input{grid-column:1/-1;width:100%;max-width:100%;justify-self:stretch;-webkit-appearance:none;appearance:none}.calendar-controls #anniversaryBtn{grid-column:1/-1}.calendar-controls .press-btn,.log-search .press-btn{width:100%;min-width:0;padding-left:7px!important;padding-right:7px!important}.day-tools{margin-top:3px;overflow:visible;padding:0 0 4px}.log-search{grid-template-columns:minmax(0,1fr) 64px}.log-search input{height:38px}.scene-nav .press-btn{font-size:11px}.card-head{margin-bottom:9px;padding-bottom:8px}.card-head b{font-size:11px}}</style></head><body><header class="site-header"><div class="site-header__inner"><a class="brand" href="../">我らのあそび場</a><button class="lock-btn" data-lock>鍵をかける</button></div></header><main class="shell app-shell conversation-shell"><div class="backline"><a href="../">← あそび場にもどる</a></div><section class="app-title"><div class="icon">📅</div><div><h1>あの日のわれわれ</h1></div></section><div class="day-tools"><div class="calendar-controls"><input id="pickDate" type="date"><button class="press-btn" id="todayBtn">今日</button><button class="press-btn" id="randomDay">ランダム</button><button class="press-btn" id="anniversaryBtn">どうでもいい記念日を引く</button></div><div class="log-search"><input id="logSearch" type="search" placeholder="会話のことばで探す"><button class="press-btn" id="searchBtn">検索</button></div><div class="search-note" id="searchNote"></div></div><div class="anniversary-note" id="anniversaryNote"></div><section class="conversation-card"><div class="card-head"><b id="dayTitle">---</b><span id="dayMeta"></span></div><div id="dayScene"></div></section><div class="scene-nav" id="sceneNav"></div></main><script src="../assets/auth.js"></script><script src="../assets/common.js"></script><script src="../assets/data.js"></script><script>
(async()=>{wireLock('../');const [core,memories,quizScenePack,analytics]=await Promise.all([WareraData.core('../'),WareraData.memories('../'),WareraData.quizScenePack('../'),WareraData.expandedAnalytics('../')]);const quizScenes=quizScenePack.scenes||[],anniversaries=analytics.anniversaries||core.anniversaries||[];const grouped=new Map();memories.forEach(x=>{if(!grouped.has(x.date))grouped.set(x.date,[]);grouped.get(x.date).push(x)});const quizById=new Map(quizScenes.map(x=>[String(x.id),x])),dates=[...grouped.keys()].sort();const picker=document.getElementById('pickDate'),title=document.getElementById('dayTitle'),meta=document.getElementById('dayMeta'),scene=document.getElementById('dayScene'),nav=document.getElementById('sceneNav'),search=document.getElementById('logSearch'),searchBtn=document.getElementById('searchBtn'),searchNote=document.getElementById('searchNote'),anniversaryNote=document.getElementById('anniversaryNote');picker.min=dates[0]||'';picker.max=dates.at(-1)||'';let current=null,currentSceneId=null;
function chatNode(item){const wrap=document.createElement('div');wrap.className='chat-scene';(item?.lines||[]).forEach(x=>{const row=document.createElement('div');row.className='chat-line '+(x.who==='み'?'mine':'theirs');const w=document.createElement('span');w.className='who';w.textContent=x.who;const b=document.createElement('div');b.className='bubble';b.textContent=x.text;x.who==='み'?row.append(b,w):row.append(w,b);wrap.append(row)});return wrap}
function dayPool(date){const all=grouped.get(date)||[],readable=all.filter(WareraData.readableScene);return readable.length?readable:all}
function setUrl(item,around=false,source=''){if(!item)return;const u=new URL(location.href);u.searchParams.set('date',item.date);u.searchParams.set('scene',item.id);if(around)u.searchParams.set('around','1');else u.searchParams.delete('around');if(source)u.searchParams.set('source',source);else u.searchParams.delete('source');history.replaceState(null,'',u)}
function btn(label,cls=''){const b=document.createElement('button');b.className='press-btn '+cls;b.textContent=label;return b}
function shareButton(item){const b=btn('画像にする');b.onclick=async()=>{b.disabled=true;try{await WareraShare.shareScene(item)}finally{b.disabled=false}};return b}
function showAnniversary(date){const hits=anniversaries.filter(x=>x.date===date);anniversaryNote.classList.toggle('is-show',!!hits.length);anniversaryNote.innerHTML=hits.length?`<b>どうでもいい記念日</b><span class="anniversary-date">${esc(fmtDate(date))}</span><br>${hits.map(x=>esc(x.label||x.title||'記念日')).join('<br>')}`:''}
function renderSingle(item,pool){currentSceneId=item?.id??null;scene.replaceChildren();nav.replaceChildren();if(!item)return;scene.append(chatNode(item));setUrl(item,false);const idx=pool.findIndex(x=>String(x.id)===String(item.id)),another=btn('同じ日の別の会話','primary primary-action');another.onclick=()=>sceneFor(item.date);const around=btn('この会話の前後を見る');around.onclick=()=>renderAround(item,pool);nav.append(another,around,shareButton(item));if(idx>0){const p=btn('← 前の会話');p.onclick=()=>renderSingle(pool[idx-1],pool);nav.append(p)}if(idx>=0&&idx<pool.length-1){const n=btn('次の会話 →');n.onclick=()=>renderSingle(pool[idx+1],pool);nav.append(n)}}
function renderAround(item,pool){currentSceneId=item?.id??null;scene.replaceChildren();nav.replaceChildren();const idx=pool.findIndex(x=>String(x.id)===String(item.id)),from=Math.max(0,idx-1),to=Math.min(pool.length-1,idx+1),wrap=document.createElement('div');wrap.className='around-wrap';for(let i=from;i<=to;i++){const block=document.createElement('section');block.className='around-block'+(i===idx?' is-current':'');const label=document.createElement('div');label.className='around-label';label.textContent=i===idx?'いま見ている会話':i<idx?'少し前の会話':'少しあとの会話';block.append(label,chatNode(pool[i]));wrap.append(block)}scene.append(wrap);setUrl(item,true);const back=btn('この会話だけに戻す','primary primary-action');back.onclick=()=>renderSingle(item,pool);nav.append(back,shareButton(item));if(idx>0){const p=btn('← さらに前の会話');p.onclick=()=>renderAround(pool[idx-1],pool);nav.append(p)}if(idx>=0&&idx<pool.length-1){const n=btn('さらに後の会話 →');n.onclick=()=>renderAround(pool[idx+1],pool);nav.append(n)}}
function renderQuizContext(item){current=item.date;currentSceneId=item.id;picker.value=item.date;title.textContent=fmtDate(item.date);meta.textContent='検定の前後';searchNote.textContent='検定に出た発言の前後';showAnniversary(item.date);scene.replaceChildren(chatNode(item));nav.replaceChildren();setUrl(item,false,'quiz');const b=btn('同じ日の別の会話','primary primary-action');b.onclick=()=>sceneFor(item.date);nav.append(b,shareButton(item))}
function sceneFor(date,requestedId=null,wantAround=false){current=date;showAnniversary(date);const all=grouped.get(date)||[];if(!all.length){title.textContent='この日のログはまだない';meta.textContent='';scene.innerHTML='<div class="empty">日付を変えるか、ランダムな日をどうぞ。</div>';nav.replaceChildren();return}title.textContent=fmtDate(date);const pool=dayPool(date);let item=requestedId!=null?all.find(x=>String(x.id)===String(requestedId)):null;if(!item){const choices=pool.filter(x=>String(x.id)!==String(currentSceneId)),src=choices.length?choices:pool;item=src[Math.floor(Math.random()*src.length)]}meta.textContent=`${pool.length}会話`;wantAround?renderAround(item,pool):renderSingle(item,pool)}
function loadDate(d,sceneId=null,wantAround=false){picker.value=d;currentSceneId=null;searchNote.textContent='';sceneFor(d,sceneId,wantAround)}
picker.onchange=()=>loadDate(picker.value);document.getElementById('randomDay').onclick=()=>loadDate(dates[Math.floor(Math.random()*dates.length)]);document.getElementById('anniversaryBtn').onclick=()=>{const pool=anniversaries.filter(x=>grouped.has(x.date));if(!pool.length){anniversaryNote.classList.add('is-show');anniversaryNote.textContent='記念日が見つからんかった。';return}const x=pool[Math.floor(Math.random()*pool.length)];loadDate(x.date);showAnniversary(x.date)};document.getElementById('todayBtn').onclick=()=>{const now=new Date(),md=`-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`,match=[...dates].reverse().find(x=>x.endsWith(md));match?loadDate(match):sceneFor('')};
function runSearch(){const q=search.value.trim();if(!q){searchNote.textContent='ことばを入れてね';return}const hits=memories.filter(x=>(x.lines||[]).some(l=>String(l.text||'').includes(q)));if(!hits.length){searchNote.textContent='見つからんかった。';return}const readableHits=hits.filter(WareraData.readableScene),pool=readableHits.length?readableHits:hits,item=pool[Math.floor(Math.random()*pool.length)];loadDate(item.date,item.id,true);searchNote.textContent=`「${q}」を含む会話 ${hits.length}件`}searchBtn.onclick=runSearch;search.onkeydown=e=>{if(e.key==='Enter')runSearch()};
const params=new URLSearchParams(location.search),pd=params.get('date'),ps=params.get('scene'),pa=params.get('around')==='1',src=params.get('source');const qScene=ps?quizById.get(String(ps)):null;if((src==='quiz'||qScene)&&qScene)renderQuizContext(qScene);else if(pd&&grouped.has(pd))loadDate(pd,ps,pa);else loadDate(dates[Math.floor(Math.random()*dates.length)])})();
</script></body></html>
