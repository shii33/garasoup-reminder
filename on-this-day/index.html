<!DOCTYPE html><html lang="ja" class="notranslate" translate="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><meta name="robots" content="noindex,nofollow,noarchive"><title>あの日のわれわれ｜我らのあそび場</title><link rel="stylesheet" href="../assets/site.css"><style>@media(max-width:580px){input,textarea,select{font-size:16px!important}}.log-search{display:flex;gap:8px;margin:12px 0 4px}.log-search input{flex:1;min-width:0;height:42px;border:1px solid #111;border-radius:10px;padding:0 11px;background:#fff;box-shadow:2px 2px 0 rgba(0,0,0,.45)}.search-note{min-height:20px;margin-top:7px;color:#666;font-size:11px}</style></head><body><header class="site-header"><div class="site-header__inner"><a class="brand" href="../">我らのあそび場</a><button class="lock-btn" data-lock>鍵をかける</button></div></header><main class="shell app-shell conversation-shell"><div class="backline"><a href="../">← あそび場にもどる</a></div><section class="app-title"><div class="icon">📅</div><div><h1>あの日のわれわれ</h1><p>日付を選んで、その日のわれわれを見に行く。</p></div></section><div style="height:24px"></div><section class="panel"><div class="calendar-controls"><input id="pickDate" type="date"><button class="press-btn" id="todayBtn">今日</button><button class="press-btn" id="randomDay">ランダムな日</button><button class="press-btn primary" id="another">別の場面</button></div><div class="log-search"><input id="logSearch" type="search" placeholder="会話のことばで探す"><button class="press-btn" id="searchBtn">検索</button></div><div class="search-note" id="searchNote"></div><div class="section-head"><h2 id="dayTitle">---</h2><span id="dayMeta"></span></div><div class="chat-scene" id="dayScene"></div></section></main><script src="../assets/auth.js"></script><script src="../assets/common.js"></script><script src="../assets/data.js"></script><script>
(async()=>{
  wireLock('../');
  const memories=await WareraData.memories('../');
  const grouped=new Map();
  memories.forEach(x=>{if(!grouped.has(x.date))grouped.set(x.date,[]);grouped.get(x.date).push(x)});
  const dates=[...grouped.keys()].sort();
  const picker=document.getElementById('pickDate'),title=document.getElementById('dayTitle'),meta=document.getElementById('dayMeta'),scene=document.getElementById('dayScene');
  const search=document.getElementById('logSearch'),searchBtn=document.getElementById('searchBtn'),searchNote=document.getElementById('searchNote');
  picker.min=dates[0]||'';picker.max=dates.at(-1)||'';
  let current=null,currentSceneId=null;

  function renderScene(item){
    currentSceneId=item?.id??null;
    scene.replaceChildren();
    (item?.lines||[]).forEach(x=>{const row=document.createElement('div');row.className='chat-line '+(x.who==='み'?'mine':'theirs');const w=document.createElement('span');w.className='who';w.textContent=x.who;const b=document.createElement('div');b.className='bubble';b.textContent=x.text;x.who==='み'?row.append(b,w):row.append(w,b);scene.append(row)});
    if(item){
      const u=new URL(location.href);u.searchParams.set('date',item.date);u.searchParams.set('scene',item.id);history.replaceState(null,'',u);
    }
  }

  function sceneFor(date,requestedId=null){
    current=date;
    const all=grouped.get(date)||[];
    if(!all.length){title.textContent='この日のログはまだない';meta.textContent='';scene.innerHTML='<div class="empty">日付を変えるか、ランダムな日をどうぞ。</div>';return}
    title.textContent=fmtDate(date);
    const readable=all.filter(WareraData.readableScene);
    const pool=readable.length?readable:all;
    let item=requestedId!=null?all.find(x=>String(x.id)===String(requestedId)):null;
    if(!item){
      const choices=pool.filter(x=>String(x.id)!==String(currentSceneId));
      const src=choices.length?choices:pool;
      item=src[Math.floor(Math.random()*src.length)];
    }
    meta.textContent=`${pool.length}場面`;
    renderScene(item);
  }

  function loadDate(d,sceneId=null){picker.value=d;currentSceneId=null;searchNote.textContent='';sceneFor(d,sceneId)}
  picker.onchange=()=>loadDate(picker.value);
  document.getElementById('another').onclick=()=>sceneFor(current);
  document.getElementById('randomDay').onclick=()=>loadDate(dates[Math.floor(Math.random()*dates.length)]);
  document.getElementById('todayBtn').onclick=()=>{const now=new Date(),md=`-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`,match=[...dates].reverse().find(x=>x.endsWith(md));match?loadDate(match):sceneFor('')};

  function runSearch(){
    const q=search.value.trim();
    if(!q){searchNote.textContent='ことばを入れてね';return}
    const hits=memories.filter(x=>(x.lines||[]).some(l=>String(l.text||'').includes(q)));
    if(!hits.length){searchNote.textContent='見つからんかった。';return}
    const readableHits=hits.filter(WareraData.readableScene);
    const pool=readableHits.length?readableHits:hits;
    const item=pool[Math.floor(Math.random()*pool.length)];
    loadDate(item.date,item.id);
    searchNote.textContent=`「${q}」を含む場面 ${hits.length}件`;
  }
  searchBtn.onclick=runSearch;search.onkeydown=e=>{if(e.key==='Enter')runSearch()};

  const params=new URLSearchParams(location.search),pd=params.get('date'),ps=params.get('scene');
  if(pd&&grouped.has(pd)) loadDate(pd,ps);
  else{const now=new Date(),md=`-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`,match=[...dates].reverse().find(x=>x.endsWith(md));loadDate(match||dates.at(-1));}
})();
</script></body></html>
