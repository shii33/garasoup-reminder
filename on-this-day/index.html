<!DOCTYPE html><html lang="ja" class="notranslate" translate="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><meta name="robots" content="noindex,nofollow,noarchive"><title>あの日のわれわれ｜我らのあそび場</title><link rel="stylesheet" href="../assets/site.css"></head><body><header class="site-header"><div class="site-header__inner"><a class="brand" href="../">我らのあそび場</a><button class="lock-btn" data-lock>鍵をかける</button></div></header><main class="shell app-shell conversation-shell"><div class="backline"><a href="../">← あそび場にもどる</a></div><section class="app-title"><div class="icon">📅</div><div><h1>あの日のわれわれ</h1><p>日付を選んで、その日のわれわれを見に行く。</p></div></section><div style="height:24px"></div><section class="panel"><div class="calendar-controls"><input id="pickDate" type="date"><button class="press-btn" id="todayBtn">今日</button><button class="press-btn" id="randomDay">ランダムな日</button><button class="press-btn primary" id="another">別の場面</button></div><div class="section-head"><h2 id="dayTitle">---</h2><span id="dayMeta"></span></div><div class="chat-scene" id="dayScene"></div></section></main><script src="../assets/auth.js"></script><script src="../assets/common.js"></script><script src="../assets/data.js"></script><script>
(async()=>{
  wireLock('../');
  const memories=await WareraData.memories('../');
  const grouped=new Map();
  memories.forEach(x=>{if(!grouped.has(x.date))grouped.set(x.date,[]);grouped.get(x.date).push(x)});
  const dates=[...grouped.keys()].sort();
  const picker=document.getElementById('pickDate'),title=document.getElementById('dayTitle'),meta=document.getElementById('dayMeta'),scene=document.getElementById('dayScene');
  picker.min=dates[0]||'';picker.max=dates.at(-1)||'';
  let current=null,lastScene=-1;
  function sceneFor(date){current=date;const items=grouped.get(date)||[];if(!items.length){title.textContent='この日のログはまだない';meta.textContent='';scene.innerHTML='<div class="empty">日付を変えるか、ランダムな日をどうぞ。</div>';return}title.textContent=fmtDate(date);meta.textContent=`${items.length}場面`;let idx=0;if(items.length>1){do{idx=Math.floor(Math.random()*items.length)}while(idx===lastScene)}lastScene=idx;scene.replaceChildren();items[idx].lines.forEach(x=>{const row=document.createElement('div');row.className='chat-line '+(x.who==='み'?'mine':'theirs');const w=document.createElement('span');w.className='who';w.textContent=x.who;const b=document.createElement('div');b.className='bubble';b.textContent=x.text;x.who==='み'?row.append(b,w):row.append(w,b);scene.append(row)})}
  function loadDate(d){picker.value=d;lastScene=-1;sceneFor(d)}
  picker.onchange=()=>loadDate(picker.value);document.getElementById('another').onclick=()=>sceneFor(current);document.getElementById('randomDay').onclick=()=>loadDate(dates[Math.floor(Math.random()*dates.length)]);document.getElementById('todayBtn').onclick=()=>{const now=new Date(),md=`-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`,match=[...dates].reverse().find(x=>x.endsWith(md));match?loadDate(match):sceneFor('')};const now=new Date(),md=`-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`,match=[...dates].reverse().find(x=>x.endsWith(md));loadDate(match||dates.at(-1));
})();
</script></body></html>
