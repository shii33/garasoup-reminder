<!DOCTYPE html><html lang="ja" class="notranslate" translate="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><meta name="robots" content="noindex,nofollow,noarchive"><title>あの日のわれわれ｜我らのあそび場</title><link rel="stylesheet" href="../assets/site.css"><style>@media(max-width:580px){input,textarea,select{font-size:16px!important}}.log-search{display:flex;gap:8px;margin:12px 0 4px}.log-search input{flex:1;min-width:0;height:42px;border:1px solid #111;border-radius:10px;padding:0 11px;background:#fff;box-shadow:2px 2px 0 rgba(0,0,0,.45)}.search-note{min-height:20px;margin-top:7px;color:#666;font-size:11px}.scene-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.scene-nav .press-btn{height:40px}.around-wrap{display:grid;gap:14px}.around-block{padding:14px;border:1px solid #ddd;border-radius:10px;background:#fafafa}.around-block.is-current{border-color:#111;background:#fff;box-shadow:2px 2px 0 rgba(0,0,0,.2)}.around-label{font-size:11px;font-weight:800;color:#777;margin-bottom:10px}.around-block.is-current .around-label{color:#111}</style></head><body><header class="site-header"><div class="site-header__inner"><a class="brand" href="../">我らのあそび場</a><button class="lock-btn" data-lock>鍵をかける</button></div></header><main class="shell app-shell conversation-shell"><div class="backline"><a href="../">← あそび場にもどる</a></div><section class="app-title"><div class="icon">📅</div><div><h1>あの日のわれわれ</h1><p>日付を選んで、その日のわれわれを見に行く。</p></div></section><div style="height:24px"></div><section class="panel"><div class="calendar-controls"><input id="pickDate" type="date"><button class="press-btn" id="todayBtn">今日</button><button class="press-btn" id="randomDay">ランダムな日</button><button class="press-btn primary" id="another">別の場面</button></div><div class="log-search"><input id="logSearch" type="search" placeholder="会話のことばで探す"><button class="press-btn" id="searchBtn">検索</button></div><div class="search-note" id="searchNote"></div><div class="section-head"><h2 id="dayTitle">---</h2><span id="dayMeta"></span></div><div id="dayScene"></div><div class="scene-nav" id="sceneNav"></div></section></main><script src="../assets/auth.js"></script><script src="../assets/common.js"></script><script src="../assets/data.js"></script><script>
(async()=>{
  wireLock('../');
  const memories=await WareraData.memories('../');
  const grouped=new Map();
  memories.forEach(x=>{if(!grouped.has(x.date))grouped.set(x.date,[]);grouped.get(x.date).push(x)});
  const dates=[...grouped.keys()].sort();
  const picker=document.getElementById('pickDate'),title=document.getElementById('dayTitle'),meta=document.getElementById('dayMeta'),scene=document.getElementById('dayScene'),nav=document.getElementById('sceneNav');
  const search=document.getElementById('logSearch'),searchBtn=document.getElementById('searchBtn'),searchNote=document.getElementById('searchNote');
  picker.min=dates[0]||'';picker.max=dates.at(-1)||'';
  let current=null,currentSceneId=null,aroundMode=false;

  function chatNode(item){
    const wrap=document.createElement('div');wrap.className='chat-scene';
    (item?.lines||[]).forEach(x=>{const row=document.createElement('div');row.className='chat-line '+(x.who==='み'?'mine':'theirs');const w=document.createElement('span');w.className='who';w.textContent=x.who;const b=document.createElement('div');b.className='bubble';b.textContent=x.text;x.who==='み'?row.append(b,w):row.append(w,b);wrap.append(row)});
    return wrap;
  }

  function dayPool(date){
    const all=grouped.get(date)||[];
    const readable=all.filter(WareraData.readableScene);
    return readable.length?readable:all;
  }

  function setUrl(item,around=false){
    if(!item)return;
    const u=new URL(location.href);u.searchParams.set('date',item.date);u.searchParams.set('scene',item.id);
    if(around)u.searchParams.set('around','1');else u.searchParams.delete('around');
    history.replaceState(null,'',u);
  }

  function renderSingle(item,pool){
    aroundMode=false;currentSceneId=item?.id??null;scene.replaceChildren();nav.replaceChildren();
    if(!item)return;
    scene.append(chatNode(item));setUrl(item,false);
    const idx=pool.findIndex(x=>String(x.id)===String(item.id));
    if(idx>0){const b=document.createElement('button');b.className='press-btn';b.textContent='← 前の場面';b.onclick=()=>renderSingle(pool[idx-1],pool);nav.append(b)}
    const around=document.createElement('button');around.className='press-btn';around.textContent='この周辺を見る';around.onclick=()=>renderAround(item,pool);nav.append(around);
    if(idx>=0&&idx<pool.length-1){const b=document.createElement('button');b.className='press-btn';b.textContent='次の場面 →';b.onclick=()=>renderSingle(pool[idx+1],pool);nav.append(b)}
  }

  function renderAround(item,pool){
    aroundMode=true;currentSceneId=item?.id??null;scene.replaceChildren();nav.replaceChildren();
    const idx=pool.findIndex(x=>String(x.id)===String(item.id));
    const from=Math.max(0,idx-1),to=Math.min(pool.length-1,idx+1);
    const wrap=document.createElement('div');wrap.className='around-wrap';
    for(let i=from;i<=to;i++){
      const block=document.createElement('section');block.className='around-block'+(i===idx?' is-current':'');
      const label=document.createElement('div');label.className='around-label';label.textContent=i===idx?'いま見ている場面':i<idx?'少し前':'少しあと';
      block.append(label,chatNode(pool[i]));wrap.append(block);
    }
    scene.append(wrap);setUrl(item,true);
    const back=document.createElement('button');back.className='press-btn';back.textContent='1場面表示に戻す';back.onclick=()=>renderSingle(item,pool);nav.append(back);
    if(idx>0){const b=document.createElement('button');b.className='press-btn';b.textContent='← さらに前';b.onclick=()=>renderAround(pool[idx-1],pool);nav.append(b)}
    if(idx>=0&&idx<pool.length-1){const b=document.createElement('button');b.className='press-btn';b.textContent='さらに後 →';b.onclick=()=>renderAround(pool[idx+1],pool);nav.append(b)}
  }

  function sceneFor(date,requestedId=null,wantAround=false){
    current=date;const all=grouped.get(date)||[];
    if(!all.length){title.textContent='この日のログはまだない';meta.textContent='';scene.innerHTML='<div class="empty">日付を変えるか、ランダムな日をどうぞ。</div>';nav.replaceChildren();return}
    title.textContent=fmtDate(date);const pool=dayPool(date);
    let item=requestedId!=null?all.find(x=>String(x.id)===String(requestedId)):null;
    if(!item){const choices=pool.filter(x=>String(x.id)!==String(currentSceneId));const src=choices.length?choices:pool;item=src[Math.floor(Math.random()*src.length)]}
    meta.textContent=`${pool.length}場面`;
    if(wantAround)renderAround(item,pool);else renderSingle(item,pool);
  }

  function loadDate(d,sceneId=null,wantAround=false){picker.value=d;currentSceneId=null;searchNote.textContent='';sceneFor(d,sceneId,wantAround)}
  picker.onchange=()=>loadDate(picker.value);
  document.getElementById('another').onclick=()=>sceneFor(current,null,false);
  document.getElementById('randomDay').onclick=()=>loadDate(dates[Math.floor(Math.random()*dates.length)]);
  document.getElementById('todayBtn').onclick=()=>{const now=new Date(),md=`-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`,match=[...dates].reverse().find(x=>x.endsWith(md));match?loadDate(match):sceneFor('')};

  function runSearch(){
    const q=search.value.trim();if(!q){searchNote.textContent='ことばを入れてね';return}
    const hits=memories.filter(x=>(x.lines||[]).some(l=>String(l.text||'').includes(q)));
    if(!hits.length){searchNote.textContent='見つからんかった。';return}
    const readableHits=hits.filter(WareraData.readableScene),pool=readableHits.length?readableHits:hits,item=pool[Math.floor(Math.random()*pool.length)];
    loadDate(item.date,item.id,true);searchNote.textContent=`「${q}」を含む場面 ${hits.length}件`;
  }
  searchBtn.onclick=runSearch;search.onkeydown=e=>{if(e.key==='Enter')runSearch()};

  const params=new URLSearchParams(location.search),pd=params.get('date'),ps=params.get('scene'),pa=params.get('around')==='1';
  if(pd&&grouped.has(pd))loadDate(pd,ps,pa);
  else{const now=new Date(),md=`-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`,match=[...dates].reverse().find(x=>x.endsWith(md));loadDate(match||dates.at(-1));}
})();
</script></body></html>
